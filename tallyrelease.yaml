# yaml-language-server: $schema=./node_modules/@tallyrelease/cli/dist/tallyrelease.schema.json
plugins:
  node: {}
defaults:
  release: true
  tagFormat: "{id}-source-v{version}"
  propagate: patch
bumps:
  preMajor:
    breaking: major
branches:
  - name: main
    line: default
units:
  actions/evaluate-event:
    versionFiles:
      - file: actions/evaluate-event/README.md
        pattern: "@{id}-v{major}"
      - file: actions/evaluate-event/README.md
        pattern: "@{id}-v{version}"
  actions/exchange-github-token:
