# CI for Yarn + Turborepo monorepos that mix Node.js, Python and Go.
# Checks, builds and tests every change. On push to the default branch it packs the dist units into the
# dist payload, prunes the source units into the source payload and creates releases. Both payloads are
# target-neutral artifacts. The released units are exposed as one release list through the `releases`
# output. Publishing is wired by the caller.

name: App Monorepo Stack

on:
  workflow_call:
    inputs:
      token-broker-url:
        type: string
        required: false
        default: ""
        description: |-
          URL of the token broker for OIDC token exchange.
          **Default:** Falls back to `vars.TOKEN_BROKER_URL` if not provided.
      default-branch:
        type: string
        required: false
        default: "main"
        description: |-
          Default branch name for the repository.
          **Default:** `main`
          **Example:** `main`, `master`, `develop`
      test-types:
        type: string
        required: false
        default: "unit"
        description: |-
          Comma-separated list of test types to run.
          **Valid values:** `unit`, `integration`, `e2e`
          **Default:** `unit`
          **Example:** `unit,integration,e2e`
      run-unit-tests-in-build:
        type: boolean
        required: false
        default: true
        description: |-
          Run unit tests as part of the check job instead of a separate job.
          Recommended for smaller monorepos to reduce overall execution time.
          **Default:** `true`
          **Note:** You must include `unit` in the `test-types` input for this to have any effect.
      run-build-before-check:
        type: boolean
        required: false
        default: false
        description: |-
          Run the build step before the check step in the check job.
          Useful for monorepos where eslint/prettier/etc config packages must be built before linters can run.
          **Default:** `false`
          **Note:** When enabled, the order becomes: Install → Dependencies Check → Build → Check → Unit Tests
      checkout-submodules:
        type: string
        required: false
        default: "false"
        description: |-
          Whether to checkout submodules.
          **Default:** `false`
          **Example:** `true`, `false`, `recursive`
          **Note:** Use `recursive` to recursively checkout submodules
      checkout-token-resources:
        type: string
        required: false
        default: ""
        description: |-
          Additional resources the checkout token must be able to read, whitespace-separated.
          When set, the workflow exchanges its OIDC token at the token broker for an installation token with `contents:read` on this repository plus these resources, and uses it for every checkout.
          **Default:** _empty_ (no exchange; `GITHUB_TOKEN` is used)
          **Format:** `repo:owner/name`, `org:name` or `enterprise:slug`
          **Example:** `repo:my-org/private-submodule repo:my-org/go-lib`
          **Requires:** `token-broker-url` (or the `TOKEN_BROKER_URL` repository variable), and the token broker's GitHub App installed on this repository and every listed resource
          **Note:** Unavailable on pull requests from forks, which have no OIDC token; those runs use `GITHUB_TOKEN`
      prerelease-channel:
        type: string
        required: false
        default: ""
        description: |-
          Prerelease channel name (e.g., "beta", "canary", "rc").
          When set, computes prerelease versions and sets the channel of prerelease entries in the release list.
      source-units:
        type: string
        required: false
        default: "apps/*"
        description: |-
          Units pruned into the source payload, one directory pattern per line.
          `*` matches exactly one path segment. Only directories with a `package.json` count.
          **Default:** `apps/*`
          **Example:** `apps/*` and `services/*` on separate lines
      dist-units:
        type: string
        required: false
        default: "packages/*"
        description: |-
          Units packed into the dist payload, one directory pattern per line.
          `*` matches exactly one path segment. Only directories with a `package.json` count.
          **Default:** `packages/*`
          **Example:** `packages/*` and `libs/*` on separate lines

    outputs:
      releases:
        value: ${{ jobs.releases.outputs.releases || '[]' }}
        description: |-
          Release list (schema 1), a compact JSON array with one entry per released unit, for publish workflows such as `publish-oci` and `publish-npm`.
          Each entry: {schema: 1, name, path, version, channel, sha, payloads}.
          `payloads.source` is set for source units, `payloads.dist` for dist units.
          `[]` when nothing was released.

permissions: {}

env:
  NODE_OPTIONS: "--max-old-space-size=4096"

defaults:
  run:
    shell: bash

jobs:
  # Resolve the event, validate the repository, resolve the units and discover test types.
  configure:
    name: Configure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      # Commit SHA to check out.
      commit-sha: ${{ steps.event.outputs.commit_sha }}

      # Pipeline mode (pr, main or none) and whether the run may use credentials.
      mode: ${{ steps.event.outputs.mode }}
      trusted: ${{ steps.event.outputs.trusted }}

      # Unit paths as compact JSON arrays.
      source-units: ${{ steps.units.outputs.source-units }}
      dist-units: ${{ steps.units.outputs.dist-units }}

      # Test types to run.
      test-types: ${{ steps.evaluate.outputs.test_types }}
      test-types-for-matrix: ${{ steps.evaluate.outputs.test_types_for_matrix }}
    steps:
      # Resolve the commit SHA, mode and trust level for this event.
      - name: Evaluate event
        id: event
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ inputs.default-branch }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request_target" ]]; then
            echo "::error::'pull_request_target' is not supported by app-monorepo-stack. Switch the caller to 'pull_request'."
            exit 1
          fi

          mode="none"
          trusted="false"

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            mode="pr"
            if [[ "$HEAD_REPOSITORY" == "$REPOSITORY" && "$ACTOR" != "dependabot[bot]" ]]; then
              trusted="true"
            fi
          elif [[ "$EVENT_NAME" == "merge_group" ]]; then
            trusted="true"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            trusted="true"
            if [[ "$REF" == "refs/heads/$DEFAULT_BRANCH" ]]; then
              mode="main"
            fi
          fi

          echo "commit_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "trusted=$trusted" >> "$GITHUB_OUTPUT"

          echo "Event: $EVENT_NAME"
          echo "Commit SHA: $HEAD_SHA"
          echo "Mode: $mode"
          echo "Trusted: $trusted"

      # Check out resolved commit for evaluation.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ steps.event.outputs.commit_sha }}
          submodules: false

      - name: Validate Makefile
        run: |
          if [ ! -f "Makefile" ]; then
            echo "::error::Makefile not found. app-monorepo-stack requires a Makefile."
            echo "::error::Required targets: 'install' and 'install-immutable'"
            exit 1
          fi
          if ! grep -qE '^install-immutable:' Makefile; then
            echo "::error::Makefile missing required 'install-immutable' target"
            exit 1
          fi

      # Every directory matching a pattern line that contains a package.json is a unit. The unquoted
      # pattern is expanded by bash, so `*` matches one path segment.
      - name: Resolve units
        id: units
        env:
          INPUT_SOURCE_UNITS: ${{ inputs.source-units }}
          INPUT_DIST_UNITS: ${{ inputs.dist-units }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          resolve() {
            local output="$1" patterns="$2" pattern dir units duplicates
            units=$(
              while read -r pattern; do
                [[ -n "$pattern" ]] || continue
                if [[ ! "$pattern" =~ ^[A-Za-z0-9._/*-]+$ ]]; then
                  echo "::error::Invalid pattern '$pattern' in $output: only path segments and '*' are supported" >&2
                  exit 1
                fi
                for dir in $pattern; do
                  if [[ -f "$dir/package.json" ]]; then
                    echo "${dir%/}"
                  fi
                done
              done <<< "$patterns" | jq -R -s -c 'split("\n") | map(select(length > 0)) | unique'
            )

            duplicates=$(jq -r 'group_by(split("/") | last) | map(select(length > 1) | join(", ")) | join("; ")' <<< "$units")
            if [[ -n "$duplicates" ]]; then
              echo "::error::Duplicate basenames in $output: $duplicates"
              exit 1
            fi

            echo "$output=$units" >> "$GITHUB_OUTPUT"
            echo "$output: $units"
          }

          resolve source-units "$INPUT_SOURCE_UNITS"
          resolve dist-units "$INPUT_DIST_UNITS"

      # Parse test types.
      - name: Evaluate
        id: evaluate
        env:
          INPUT_TEST_TYPES: ${{ inputs.test-types }}
          INPUT_RUN_UNIT_TESTS_IN_BUILD: ${{ inputs.run-unit-tests-in-build }}
        run: |
          # Parse and validate test types
          test_types=()
          test_types_for_matrix=()
          valid_types=("unit" "integration" "e2e")

          if [ -n "$INPUT_TEST_TYPES" ]; then
            IFS=',' read -ra types <<< "$INPUT_TEST_TYPES"
            for type in "${types[@]}"; do
              # Trim whitespace
              type=$(echo "$type" | xargs)

              # Validate type
              if [[ " ${valid_types[@]} " =~ " ${type} " ]]; then
                test_types+=("$type")

                # Exclude unit tests from matrix if they run in the check job
                if [[ "$type" == "unit" && "$INPUT_RUN_UNIT_TESTS_IN_BUILD" == "true" ]]; then
                  echo "Unit tests will run in the check job, excluding from test matrix"
                else
                  test_types_for_matrix+=("$type")
                fi
              else
                echo "::warning::Invalid test type '$type' - skipping. Valid types: unit, integration, e2e"
              fi
            done
          fi

          # Convert to JSON using jq
          test_types_json=$(printf '%s\n' "${test_types[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          test_types_matrix_json=$(printf '%s\n' "${test_types_for_matrix[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0))')

          echo "test_types=$test_types_json" >> $GITHUB_OUTPUT
          echo "test_types_for_matrix=$test_types_matrix_json" >> $GITHUB_OUTPUT

          # Debug output
          echo "All test types: $test_types_json"
          echo "Test types for matrix: $test_types_matrix_json"

  # Install, check and build. Order controlled by the run-build-before-check input.
  # On push to the default branch it then packs the dist units into the dist payload.
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - configure
    permissions:
      contents: read
      packages: read
      actions: write
      id-token: write
    steps:
      - &checkout-token
        id: checkout-token
        name: Exchange token for checkout
        if: >-
          inputs.checkout-token-resources != ''
          && (github.event.pull_request == null
          || github.event.pull_request.head.repo.full_name == github.repository)
        uses: abinnovision/actions@exchange-github-token-dev
        with:
          broker-url: ${{ inputs.token-broker-url || vars.TOKEN_BROKER_URL }}
          resources: "repo:${{ github.repository }} ${{ inputs.checkout-token-resources }}"
          scope: contents:read

      - &checkout
        name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.configure.outputs.commit-sha }}
          submodules: ${{ inputs.checkout-submodules }}
          token: ${{ steps.checkout-token.outputs.token || github.token }}
      - name: Setup Tools
        uses: abinnovision/actions@setup-tools-dev
      - name: Install dependencies
        run: make install-immutable
      - name: Check dependencies
        run: |
          yarn dedupe --check || (echo "yarn.lock is not up to date, run 'yarn dedupe'" && exit 1)
          yarn turbo boundaries || (echo "turbo boundaries failed" && exit 1)
      - name: Build (before check)
        if: ${{ inputs.run-build-before-check }}
        run: yarn run build
      - name: Check
        run: yarn run check
      - name: Build (after check)
        if: ${{ !inputs.run-build-before-check }}
        run: yarn run build
      - name: Unit Tests
        if: ${{ inputs.run-unit-tests-in-build && contains(fromJSON(needs.configure.outputs.test-types), 'unit') }}
        run: yarn run test-unit

      # One version-free tarball per dist unit, named after the directory basename.
      - name: Pack dist units
        if: needs.configure.outputs.mode == 'main' && needs.configure.outputs.dist-units != '[]'
        env:
          DIST_UNITS: ${{ needs.configure.outputs.dist-units }}
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/dist"
          mapfile -t units < <(jq -r '.[]' <<< "$DIST_UNITS")
          for unit in "${units[@]}"; do
            (cd "$unit" && yarn pack --out "$RUNNER_TEMP/dist/${unit##*/}.tgz")
          done

      - name: Upload dist payload
        if: needs.configure.outputs.mode == 'main' && needs.configure.outputs.dist-units != '[]'
        uses: actions/upload-artifact@v7
        with:
          name: payload-dist
          path: ${{ runner.temp }}/dist
          retention-days: 7
          if-no-files-found: error
          # Allows re-running the job within the same workflow run.
          overwrite: true

  # Run tests in parallel per type (unit tests excluded if run-unit-tests-in-build is set).
  # Runs concurrently with check: neither job consumes build artifacts from the other.
  test:
    name: Test / ${{ matrix.test-type }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - configure
    if: ${{ fromJSON(needs.configure.outputs.test-types-for-matrix)[0] != null }}
    strategy:
      fail-fast: false
      matrix:
        test-type: ${{ fromJSON(needs.configure.outputs.test-types-for-matrix) }}
    permissions:
      contents: read
      packages: read
      actions: write
      id-token: write
    steps:
      - *checkout-token
      - *checkout
      - name: Setup Tools
        uses: abinnovision/actions@setup-tools-dev
      - name: Install dependencies
        run: make install-immutable
      - name: Build
        run: yarn run build

      # Requires test-* scripts in root package.json.
      - name: Run ${{ matrix.test-type }} tests
        env:
          TEST_TYPE: ${{ matrix.test-type }}
        run: yarn run "test-$TEST_TYPE"

  # Create releases via the release workflow.
  release:
    name: Release
    needs:
      - configure
      - check
      - test
      - pack
    uses: abinnovision/actions/.github/workflows/workflow.yaml@release-dev
    permissions:
      contents: read
      id-token: write
    with:
      prerelease-channel: ${{ inputs.prerelease-channel }}
    # Only on push to the default branch. always() prevents skipping when the test job is skipped.
    if: always() && !cancelled() && !contains(needs.*.result, 'failure') && needs.configure.outputs.mode == 'main'

  # Prune every source unit into the source payload, in parallel with check and test.
  pack:
    name: Pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - configure
    if: needs.configure.outputs.mode == 'main' && needs.configure.outputs.source-units != '[]'
    permissions:
      contents: read
      packages: read
      actions: write
      id-token: write
    steps:
      - *checkout-token
      - *checkout

      - name: Setup Tools
        uses: abinnovision/actions@setup-tools-dev

      - name: Prune source units
        env:
          SOURCE_UNITS: ${{ needs.configure.outputs.source-units }}
        run: |
          set -euo pipefail

          # Get turbo version from package.json (required)
          TURBO_VERSION=$(jq -r '.devDependencies.turbo // .dependencies.turbo // empty' package.json)

          if [ -z "$TURBO_VERSION" ]; then
            echo "::error::Turbo not found in package.json devDependencies or dependencies"
            exit 1
          fi

          echo "Turbo version: $TURBO_VERSION"

          mapfile -t units < <(jq -r '.[]' <<< "$SOURCE_UNITS")
          for unit in "${units[@]}"; do
            # Package name of the unit, used as the prune scope
            scope=$(jq -r '.name // empty' "$unit/package.json")
            if [[ -z "$scope" ]]; then
              echo "::error::Package name not found in $unit/package.json"
              exit 1
            fi

            echo "Running turbo prune for scope: $scope"
            yarn dlx turbo@"$TURBO_VERSION" prune --scope="$scope" --docker --out-dir="out/${unit##*/}"
          done

          # Tracked source tree (including submodules) plus the pruned unit trees.
          git ls-files --recurse-submodules -z | tar --null -T - -cf "$RUNNER_TEMP/source.tar"
          tar -rf "$RUNNER_TEMP/source.tar" out
          ls -lh "$RUNNER_TEMP/source.tar"

      - name: Upload source payload
        uses: actions/upload-artifact@v7
        with:
          name: payload-source
          path: ${{ runner.temp }}/source.tar
          retention-days: 7
          if-no-files-found: error
          # Allows re-running the job within the same workflow run.
          overwrite: true

  # Emit the release list (schema 1) with one entry per released unit.
  releases:
    name: Releases
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs:
      - configure
      - release
    # always() is required because a skipped test or pack job upstream of release would skip this job.
    if: always() && !cancelled() && needs.release.result == 'success' && needs.release.outputs.versions != '{}'
    permissions: {}
    outputs:
      releases: ${{ steps.evaluate.outputs.releases }}
    steps:
      - name: Evaluate
        id: evaluate
        env:
          VERSIONS: ${{ needs.release.outputs.versions }}
          SOURCE_UNITS: ${{ needs.configure.outputs.source-units }}
          DIST_UNITS: ${{ needs.configure.outputs.dist-units }}
          INPUT_PRERELEASE_CHANNEL: ${{ inputs.prerelease-channel }}
        run: |
          set -euo pipefail

          releases=$(jq -c \
            --argjson source "$SOURCE_UNITS" \
            --argjson dist "$DIST_UNITS" \
            --arg channel "$INPUT_PRERELEASE_CHANNEL" \
            '[to_entries[] | .key as $path | ($path | split("/") | last) as $name | {
              schema: 1,
              name: $name,
              path: $path,
              version: .value.packageVersion,
              channel: (if .value.type == "prerelease" then $channel else "" end),
              sha: .value.sha,
              payloads: (
                (if $path | IN($source[]) then {source: {artifact: "payload-source", file: "source.tar"}} else {} end)
                + (if $path | IN($dist[]) then {dist: {artifact: "payload-dist", file: "\($name).tgz"}} else {} end)
              )
            }]' <<< "$VERSIONS")

          echo "releases=$releases" >> "$GITHUB_OUTPUT"
          echo "Releases: $releases"

  # Single required status check for rulesets.
  status:
    name: Status
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [configure, check, test, pack, release, releases]
    if: always()
    permissions: {}
    steps:
      - name: Evaluate status
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
