# CI for Yarn + Turborepo monorepos that mix Node.js, Python and Go.
# Checks, builds and tests every change. On push to the default branch it creates releases and packs
# the released workspaces into payload artifacts (npm tarballs and an OCI build context), exposed as
# release lists through the `npm` and `oci` outputs. Publishing is wired by the caller.

name: App Monorepo Stack

on:
  workflow_call:
    inputs:
      token-broker-url:
        type: string
        required: false
        default: ""
        description: |-
          URL of the token broker for OIDC token exchange.
          **Default:** Falls back to `vars.TOKEN_BROKER_URL` if not provided.
      default-branch:
        type: string
        required: false
        default: "main"
        description: |-
          Default branch name for the repository.
          **Default:** `main`
          **Example:** `main`, `master`, `develop`
      test-types:
        type: string
        required: false
        default: "unit"
        description: |-
          Comma-separated list of test types to run.
          **Valid values:** `unit`, `integration`, `e2e`
          **Default:** `unit`
          **Example:** `unit,integration,e2e`
      run-unit-tests-in-build:
        type: boolean
        required: false
        default: true
        description: |-
          Run unit tests as part of the check job instead of a separate job.
          Recommended for smaller monorepos to reduce overall execution time.
          **Default:** `true`
          **Note:** You must include `unit` in the `test-types` input for this to have any effect.
      run-build-before-check:
        type: boolean
        required: false
        default: false
        description: |-
          Run the build step before the check step in the check job.
          Useful for monorepos where eslint/prettier/etc config packages must be built before linters can run.
          **Default:** `false`
          **Note:** When enabled, the order becomes: Install → Dependencies Check → Build → Check → Unit Tests
      checkout-submodules:
        type: string
        required: false
        default: "false"
        description: |-
          Whether to checkout submodules.
          **Default:** `false`
          **Example:** `true`, `false`, `recursive`
          **Note:** Use `recursive` to recursively checkout submodules
      checkout-token-resources:
        type: string
        required: false
        default: ""
        description: |-
          Additional resources the checkout token must be able to read, whitespace-separated.
          When set, the workflow exchanges its OIDC token at the token broker for an installation token with `contents:read` on this repository plus these resources, and uses it for every checkout.
          **Default:** _empty_ (no exchange; `GITHUB_TOKEN` is used)
          **Format:** `repo:owner/name`, `org:name` or `enterprise:slug`
          **Example:** `repo:my-org/private-submodule repo:my-org/go-lib`
          **Requires:** `token-broker-url` (or the `TOKEN_BROKER_URL` repository variable), and the token broker's GitHub App installed on this repository and every listed resource
          **Note:** Unavailable on pull requests from forks, which have no OIDC token; those runs use `GITHUB_TOKEN`
      prerelease-channel:
        type: string
        required: false
        default: ""
        description: |-
          Prerelease channel name (e.g., "beta", "canary", "rc").
          When set, computes prerelease versions and sets the channel of prerelease entries in the release lists.

    outputs:
      versions:
        value: ${{ jobs.release.outputs.versions }}
        description: |-
          JSON object mapping released/prerelease package paths to version info.
          Each entry: {version: "semver+sha", packageVersion: "clean semver", type: "release"|"prerelease", sha: "short commit SHA"}.
          Empty object {} when nothing was released.
      npm:
        value: ${{ jobs.pack.outputs.npm }}
        description: |-
          Release list (schema 1) of packed npm packages, a compact JSON array for `publish-npm`.
          Each entry: {schema: 1, name, version, channel, sha, artifact: "npm-packages", file: "<name>.tgz"}.
          Empty when nothing was packed.
      oci:
        value: ${{ jobs.pack.outputs.oci }}
        description: |-
          Release list (schema 1) of released apps with a Dockerfile, a compact JSON array for `publish-oci`.
          Each entry: {schema: 1, name, version, channel, sha, artifact: "oci-context", file: "context.tar", oci: {image, file, context, build-args, turbo-cache}}.
          Empty when nothing was packed.

permissions: {}

env:
  NODE_OPTIONS: "--max-old-space-size=4096"

defaults:
  run:
    shell: bash

jobs:
  # Resolve the event, validate the repository and discover test types.
  configure:
    name: Configure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      # Commit SHA to check out.
      commit-sha: ${{ steps.event.outputs.commit_sha }}

      # Pipeline mode (pr, main or none) and whether the run may use credentials.
      mode: ${{ steps.event.outputs.mode }}
      trusted: ${{ steps.event.outputs.trusted }}

      # Test types to run.
      test-types: ${{ steps.evaluate.outputs.test_types }}
      test-types-for-matrix: ${{ steps.evaluate.outputs.test_types_for_matrix }}
    steps:
      # Resolve the commit SHA, mode and trust level for this event.
      - name: Evaluate event
        id: event
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ inputs.default-branch }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request_target" ]]; then
            echo "::error::'pull_request_target' is not supported by app-monorepo-stack. Switch the caller to 'pull_request'."
            exit 1
          fi

          mode="none"
          trusted="false"

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            mode="pr"
            if [[ "$HEAD_REPOSITORY" == "$REPOSITORY" && "$ACTOR" != "dependabot[bot]" ]]; then
              trusted="true"
            fi
          elif [[ "$EVENT_NAME" == "merge_group" ]]; then
            trusted="true"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            trusted="true"
            if [[ "$REF" == "refs/heads/$DEFAULT_BRANCH" ]]; then
              mode="main"
            fi
          fi

          echo "commit_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "trusted=$trusted" >> "$GITHUB_OUTPUT"

          echo "Event: $EVENT_NAME"
          echo "Commit SHA: $HEAD_SHA"
          echo "Mode: $mode"
          echo "Trusted: $trusted"

      # Check out resolved commit for evaluation.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ steps.event.outputs.commit_sha }}
          submodules: false

      - name: Validate Makefile
        run: |
          if [ ! -f "Makefile" ]; then
            echo "::error::Makefile not found. app-monorepo-stack requires a Makefile."
            echo "::error::Required targets: 'install' and 'install-immutable'"
            exit 1
          fi
          if ! grep -qE '^install-immutable:' Makefile; then
            echo "::error::Makefile missing required 'install-immutable' target"
            exit 1
          fi

      - name: Validate checkout token configuration
        if: inputs.checkout-token-resources != ''
        env:
          BROKER_URL: ${{ inputs.token-broker-url || vars.TOKEN_BROKER_URL }}
        run: |
          if [[ -z "$BROKER_URL" ]]; then
            echo "::error::token-broker-url is required when checkout-token-resources is provided"
            exit 1
          fi

      # Discover available apps and packages, parse test types.
      - name: Evaluate
        id: evaluate
        env:
          INPUT_TEST_TYPES: ${{ inputs.test-types }}
          INPUT_RUN_UNIT_TESTS_IN_BUILD: ${{ inputs.run-unit-tests-in-build }}
        run: |
          # Collect apps
          apps=()
          for app_dir in apps/*/; do
            if [ -d "$app_dir" ] && [ -f "$app_dir/package.json" ] && [ -f "$app_dir/Dockerfile" ]; then
              apps+=("$(basename "$app_dir")")
            fi
          done

          # Collect packages
          packages=()
          for pkg_dir in packages/*/; do
            if [ -d "$pkg_dir" ] && [ -f "$pkg_dir/package.json" ]; then
              packages+=("$(basename "$pkg_dir")")
            fi
          done

          # Parse and validate test types
          test_types=()
          test_types_for_matrix=()
          valid_types=("unit" "integration" "e2e")

          if [ -n "$INPUT_TEST_TYPES" ]; then
            IFS=',' read -ra types <<< "$INPUT_TEST_TYPES"
            for type in "${types[@]}"; do
              # Trim whitespace
              type=$(echo "$type" | xargs)

              # Validate type
              if [[ " ${valid_types[@]} " =~ " ${type} " ]]; then
                test_types+=("$type")

                # Exclude unit tests from matrix if they run in the check job
                if [[ "$type" == "unit" && "$INPUT_RUN_UNIT_TESTS_IN_BUILD" == "true" ]]; then
                  echo "Unit tests will run in the check job, excluding from test matrix"
                else
                  test_types_for_matrix+=("$type")
                fi
              else
                echo "::warning::Invalid test type '$type' - skipping. Valid types: unit, integration, e2e"
              fi
            done
          fi

          # Convert to JSON using jq
          apps_json=$(printf '%s\n' "${apps[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          packages_json=$(printf '%s\n' "${packages[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          test_types_json=$(printf '%s\n' "${test_types[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          test_types_matrix_json=$(printf '%s\n' "${test_types_for_matrix[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0))')

          echo "apps_available=$apps_json" >> $GITHUB_OUTPUT
          echo "packages_available=$packages_json" >> $GITHUB_OUTPUT
          echo "test_types=$test_types_json" >> $GITHUB_OUTPUT
          echo "test_types_for_matrix=$test_types_matrix_json" >> $GITHUB_OUTPUT

          # Debug output
          echo "Found ${#apps[@]} apps: $apps_json"
          echo "Found ${#packages[@]} packages: $packages_json"
          echo ""
          echo "All test types: $test_types_json"
          echo "Test types for matrix: $test_types_matrix_json"

  # Install, check and build. Order controlled by the run-build-before-check input.
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - configure
    permissions:
      contents: read
      packages: read
      actions: write
      id-token: write
    steps:
      - &checkout-token
        id: checkout-token
        name: Exchange token for checkout
        if: >-
          inputs.checkout-token-resources != ''
          && (github.event.pull_request == null
          || github.event.pull_request.head.repo.full_name == github.repository)
        uses: abinnovision/actions@exchange-github-token-dev
        with:
          broker-url: ${{ inputs.token-broker-url || vars.TOKEN_BROKER_URL }}
          resources: "repo:${{ github.repository }} ${{ inputs.checkout-token-resources }}"
          scope: contents:read

      - &checkout
        name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.configure.outputs.commit-sha }}
          submodules: ${{ inputs.checkout-submodules }}
          token: ${{ steps.checkout-token.outputs.token || github.token }}
      - name: Setup Tools
        uses: abinnovision/actions@setup-tools-dev
      - name: Install dependencies
        run: make install-immutable
      - name: Check dependencies
        run: |
          yarn dedupe --check || (echo "yarn.lock is not up to date, run 'yarn dedupe'" && exit 1)
          yarn turbo boundaries || (echo "turbo boundaries failed" && exit 1)
      - name: Build (before check)
        if: ${{ inputs.run-build-before-check }}
        run: yarn run build
      - name: Check
        run: yarn run check
      - name: Build (after check)
        if: ${{ !inputs.run-build-before-check }}
        run: yarn run build
      - name: Unit Tests
        if: ${{ inputs.run-unit-tests-in-build && contains(fromJSON(needs.configure.outputs.test-types), 'unit') }}
        run: yarn run test-unit

  # Run tests in parallel per type (unit tests excluded if run-unit-tests-in-build is set).
  # Runs concurrently with check: neither job consumes build artifacts from the other.
  test:
    name: Test / ${{ matrix.test-type }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - configure
    if: ${{ fromJSON(needs.configure.outputs.test-types-for-matrix)[0] != null }}
    strategy:
      fail-fast: false
      matrix:
        test-type: ${{ fromJSON(needs.configure.outputs.test-types-for-matrix) }}
    permissions:
      contents: read
      packages: read
      actions: write
      id-token: write
    steps:
      - *checkout-token
      - *checkout
      - name: Setup Tools
        uses: abinnovision/actions@setup-tools-dev
      - name: Install dependencies
        run: make install-immutable
      - name: Build
        run: yarn run build

      # Requires test-* scripts in root package.json.
      - name: Run ${{ matrix.test-type }} tests
        env:
          TEST_TYPE: ${{ matrix.test-type }}
        run: yarn run "test-$TEST_TYPE"

  # Create releases for apps and packages via the release workflow.
  release:
    name: Release
    needs:
      - configure
      - check
      - test
    uses: abinnovision/actions/.github/workflows/workflow.yaml@release-dev
    permissions:
      contents: read
      id-token: write
    with:
      prerelease-channel: ${{ inputs.prerelease-channel }}
    # Only on push to the default branch. always() prevents skipping when the test job is skipped.
    if: always() && !cancelled() && !contains(needs.*.result, 'failure') && needs.configure.outputs.mode == 'main'

  # Pack the released workspaces into payload artifacts and emit the release lists.
  # The npm and OCI halves run independently. Units that fail to pack are left out of the lists,
  # and the final step fails the job after the lists have been written.
  pack:
    name: Pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - configure
      - release
    if: always() && !cancelled() && !contains(needs.*.result, 'failure') && needs.release.result == 'success' && needs.release.outputs.versions != '{}'
    permissions:
      contents: read
      packages: read
      actions: write
      id-token: write
    outputs:
      npm: ${{ steps.payloads.outputs.npm }}
      oci: ${{ steps.payloads.outputs.oci }}
    steps:
      - *checkout-token
      - *checkout

      - name: Setup Tools
        uses: abinnovision/actions@setup-tools-dev

      - name: Install dependencies
        run: make install-immutable

      # Select the released packages and apps that produce a payload.
      - name: Evaluate
        id: evaluate
        env:
          VERSIONS: ${{ needs.release.outputs.versions }}
          INPUT_PRERELEASE_CHANNEL: ${{ inputs.prerelease-channel }}
        run: |
          set -euo pipefail

          # Release list entries (schema 1) for every released workspace under $prefix.
          entries='[to_entries[] | select(.key | startswith($prefix)) | {
            schema: 1,
            name: (.key | ltrimstr($prefix)),
            version: .value.packageVersion,
            channel: (if .value.type == "prerelease" then $channel else "" end),
            sha: .value.sha
          }]'
          released_packages=$(jq -c --arg prefix "packages/" --arg channel "$INPUT_PRERELEASE_CHANNEL" "$entries" <<< "$VERSIONS")
          released_apps=$(jq -c --arg prefix "apps/" --arg channel "$INPUT_PRERELEASE_CHANNEL" "$entries" <<< "$VERSIONS")

          packages='[]'
          while read -r entry; do
            [[ -z "$entry" ]] && continue
            name=$(jq -r '.name' <<< "$entry")
            package_json="packages/$name/package.json"

            if [[ ! -f "$package_json" ]]; then
              echo "::warning::No package.json found at packages/$name, skipping"
              continue
            fi

            package_name=$(jq -r '.name' "$package_json")
            if [[ "$(jq -r '.private // false' "$package_json")" == "true" ]]; then
              echo "Skipping private package: $package_name"
              continue
            fi

            package_language=$(jq -r '.publishConfig.language // "nodejs"' "$package_json")
            if [[ "$package_language" != "nodejs" ]]; then
              echo "Skipping non-nodejs package: $package_name (language: $package_language)"
              continue
            fi

            echo "Selected package: $package_name (packages/$name)"
            packages=$(jq -c --argjson e "$entry" '. + [$e + {artifact: "npm-packages", file: "\($e.name).tgz"}]' <<< "$packages")
          done <<< "$(jq -c '.[]' <<< "$released_packages")"

          apps='[]'
          while read -r entry; do
            [[ -z "$entry" ]] && continue
            name=$(jq -r '.name' <<< "$entry")

            if [[ ! -f "apps/$name/Dockerfile" ]]; then
              echo "::notice::Released app '$name' has no Dockerfile, no image is built for it"
              continue
            fi

            if [[ ! -f "apps/$name/package.json" ]]; then
              echo "::warning::Released app '$name' has no package.json, skipping"
              continue
            fi

            echo "Selected app: apps/$name"
            apps=$(jq -c --argjson e "$entry" '. + [$e + {artifact: "oci-context", file: "context.tar"}]' <<< "$apps")
          done <<< "$(jq -c '.[]' <<< "$released_apps")"

          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          echo "has_packages=$(jq -c 'length > 0' <<< "$packages")" >> "$GITHUB_OUTPUT"
          echo "has_apps=$(jq -c 'length > 0' <<< "$apps")" >> "$GITHUB_OUTPUT"

          echo "Packages: $packages"
          echo "Apps: $apps"

      # npm half. Replays from the turbo cache populated by the check job.
      - name: Build
        id: npm-build
        if: ${{ !cancelled() && steps.evaluate.outputs.has_packages == 'true' }}
        run: yarn turbo build --filter="./packages/*"

      # OCI half. Tool versions passed to image builds as build arguments.
      - name: Evaluate tool versions
        id: tools
        if: ${{ !cancelled() && steps.evaluate.outputs.has_apps == 'true' }}
        run: |
          # Extract Node.js version from .tool-versions (required)
          if [ ! -f ".tool-versions" ]; then
            echo "::error::.tool-versions file not found"
            exit 1
          fi

          node_version=$(grep "^nodejs" .tool-versions | awk '{print $2}')
          if [ -z "$node_version" ]; then
            echo "::error::nodejs version not found in .tool-versions"
            exit 1
          fi
          echo "NODE_VERSION=$node_version" >> $GITHUB_OUTPUT
          echo "Node.js version: $node_version"

          # Extract optional tool versions from .tool-versions
          python_version=$(grep "^python" .tool-versions | awk '{print $2}' || true)
          if [ -n "$python_version" ]; then
            echo "PYTHON_VERSION=$python_version" >> $GITHUB_OUTPUT
            echo "Python version: $python_version"
          fi

          golang_version=$(grep "^golang" .tool-versions | awk '{print $2}' || true)
          if [ -n "$golang_version" ]; then
            echo "GOLANG_VERSION=$golang_version" >> $GITHUB_OUTPUT
            echo "Go version: $golang_version"
          fi

          uv_version=$(grep "^uv" .tool-versions | awk '{print $2}' || true)
          if [ -n "$uv_version" ]; then
            echo "UV_VERSION=$uv_version" >> $GITHUB_OUTPUT
            echo "UV version: $uv_version"
          fi

      # Created before any version stamping so image layer caches stay stable.
      # An app whose prune fails is recorded and left out of the context.
      - name: Prepare OCI context
        id: oci
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        env:
          APPS: ${{ steps.evaluate.outputs.apps }}
        run: |
          set -euo pipefail

          # Get turbo version from package.json (required)
          TURBO_VERSION=$(jq -r '.devDependencies.turbo // .dependencies.turbo // empty' package.json)

          if [ -z "$TURBO_VERSION" ]; then
            echo "::error::Turbo not found in package.json devDependencies or dependencies"
            exit 1
          fi

          echo "Turbo version: $TURBO_VERSION"

          packed='[]'
          while read -r entry; do
            [[ -z "$entry" ]] && continue
            APP=$(jq -r '.name' <<< "$entry")

            # Package name of the app, used as the prune scope
            SCOPE_NAME=$(jq -r '.name // empty' "apps/$APP/package.json" 2> /dev/null || true)
            if [ -z "$SCOPE_NAME" ]; then
              echo "::error::Package name not found in apps/$APP/package.json"
              echo "oci $APP: package name not found" >> "$RUNNER_TEMP/pack-errors"
              continue
            fi

            # Create app-specific output directory
            OUTPUT_DIR="out/$APP"
            rm -rf "$OUTPUT_DIR"
            mkdir -p "$OUTPUT_DIR"

            echo "Running turbo prune for scope: $SCOPE_NAME"
            if ! yarn dlx turbo@"$TURBO_VERSION" prune --scope="$SCOPE_NAME" --docker --out-dir="$OUTPUT_DIR"; then
              echo "::error::Turbo prune failed for app '$APP' ($SCOPE_NAME)"
              echo "oci $APP: turbo prune failed" >> "$RUNNER_TEMP/pack-errors"
              rm -rf "$OUTPUT_DIR"
              continue
            fi

            packed=$(jq -c --argjson e "$entry" '. + [$e]' <<< "$packed")
          done <<< "$(jq -c '.[]' <<< "$APPS")"

          if [[ "$(jq 'length' <<< "$packed")" -gt 0 ]]; then
            # Tracked source tree (including submodules) plus the pruned app trees.
            git ls-files --recurse-submodules -z | tar --null -T - -cf "$RUNNER_TEMP/context.tar"
            tar -rf "$RUNNER_TEMP/context.tar" out
            ls -lh "$RUNNER_TEMP/context.tar"
          fi

          echo "apps=$packed" >> "$GITHUB_OUTPUT"
          echo "has_apps=$(jq -c 'length > 0' <<< "$packed")" >> "$GITHUB_OUTPUT"

      - name: Upload OCI context
        id: upload-oci
        if: ${{ !cancelled() && steps.oci.outputs.has_apps == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: oci-context
          path: ${{ runner.temp }}/context.tar
          retention-days: 7
          if-no-files-found: error
          # Allows re-running the job within the same workflow run.
          overwrite: true

      # npm half. Stamps every released package first so workspace ranges resolve to the released versions.
      # A package whose pack fails is recorded and left out of the artifact.
      - name: Pack npm packages
        id: npm
        if: ${{ !cancelled() && steps.npm-build.outcome == 'success' }}
        env:
          VERSIONS: ${{ needs.release.outputs.versions }}
          PACKAGES: ${{ steps.evaluate.outputs.packages }}
        run: |
          set -euo pipefail

          while IFS=$'\t' read -r path version; do
            [[ -z "$path" ]] && continue
            package_json="$path/package.json"
            if [[ -f "$package_json" && -n "$version" ]]; then
              jq --arg v "$version" '.version = $v' "$package_json" > "${package_json}.tmp" && mv "${package_json}.tmp" "$package_json"
              echo "Stamped $path with $version"
            fi
          done <<< "$(jq -r 'to_entries[] | select(.key | startswith("packages/")) | "\(.key)\t\(.value.packageVersion)"' <<< "$VERSIONS")"

          mkdir -p "$RUNNER_TEMP/npm"
          packed='[]'
          while read -r entry; do
            [[ -z "$entry" ]] && continue
            name=$(jq -r '.name' <<< "$entry")

            if ! (cd "packages/$name" && yarn pack --out "$RUNNER_TEMP/npm/$name.tgz"); then
              echo "::error::yarn pack failed for package '$name'"
              echo "npm $name: yarn pack failed" >> "$RUNNER_TEMP/pack-errors"
              rm -f "$RUNNER_TEMP/npm/$name.tgz"
              continue
            fi

            packed=$(jq -c --argjson e "$entry" '. + [$e]' <<< "$packed")
          done <<< "$(jq -c '.[]' <<< "$PACKAGES")"

          ls -lh "$RUNNER_TEMP/npm"

          echo "packages=$packed" >> "$GITHUB_OUTPUT"
          echo "has_packages=$(jq -c 'length > 0' <<< "$packed")" >> "$GITHUB_OUTPUT"

      - name: Upload npm packages
        id: upload-npm
        if: ${{ !cancelled() && steps.npm.outputs.has_packages == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: npm-packages
          path: ${{ runner.temp }}/npm
          retention-days: 7
          if-no-files-found: error
          # Allows re-running the job within the same workflow run.
          overwrite: true

      # Release lists consumed by publish-npm and publish-oci. A list only contains units whose
      # payload was uploaded.
      - name: Write release lists
        id: payloads
        if: ${{ !cancelled() }}
        env:
          VERSIONS: ${{ needs.release.outputs.versions }}
          NPM_RELEASES: ${{ steps.upload-npm.outcome == 'success' && steps.npm.outputs.packages || '[]' }}
          OCI_RELEASES: ${{ steps.upload-oci.outcome == 'success' && steps.oci.outputs.apps || '[]' }}
          NODE_VERSION: ${{ steps.tools.outputs.NODE_VERSION }}
          PYTHON_VERSION: ${{ steps.tools.outputs.PYTHON_VERSION }}
          GOLANG_VERSION: ${{ steps.tools.outputs.GOLANG_VERSION }}
          UV_VERSION: ${{ steps.tools.outputs.UV_VERSION }}
        run: |
          set -euo pipefail

          oci=$(jq -c \
            --argjson versions "$VERSIONS" \
            --arg node "$NODE_VERSION" \
            --arg python "$PYTHON_VERSION" \
            --arg golang "$GOLANG_VERSION" \
            --arg uv "$UV_VERSION" \
            'map(. + {
              oci: {
                image: "app-\(.name)",
                file: "apps/\(.name)/Dockerfile",
                context: ".",
                "build-args": {
                  app_name: .name,
                  node_version: $node,
                  python_version: $python,
                  golang_version: $golang,
                  uv_version: $uv,
                  build_version: "v\($versions["apps/\(.name)"].version)",
                  build_commit: .sha
                },
                "turbo-cache": true
              }
            })' <<< "$OCI_RELEASES")
          npm=$(jq -c '.' <<< "$NPM_RELEASES")

          echo "npm=$npm" >> "$GITHUB_OUTPUT"
          echo "oci=$oci" >> "$GITHUB_OUTPUT"

          echo "npm: $npm"
          echo "oci: $oci"

      - name: Fail on pack errors
        if: ${{ !cancelled() }}
        env:
          NPM_FAILED: ${{ steps.evaluate.outputs.has_packages == 'true' && steps.upload-npm.outcome != 'success' }}
          OCI_FAILED: ${{ steps.evaluate.outputs.has_apps == 'true' && steps.upload-oci.outcome != 'success' }}
        run: |
          failed="false"

          if [[ -s "$RUNNER_TEMP/pack-errors" ]]; then
            echo "Units that failed to pack:"
            cat "$RUNNER_TEMP/pack-errors"
            failed="true"
          fi

          if [[ "$NPM_FAILED" == "true" ]]; then
            echo "::error::No npm payload was uploaded"
            failed="true"
          fi

          if [[ "$OCI_FAILED" == "true" ]]; then
            echo "::error::No OCI payload was uploaded"
            failed="true"
          fi

          [[ "$failed" == "false" ]]

  # Single required status check for rulesets.
  status:
    name: Status
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [configure, check, test, release, pack]
    if: always()
    permissions: {}
    steps:
      - name: Evaluate status
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
