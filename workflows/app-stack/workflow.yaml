# CI for Yarn repositories: Turborepo monorepos that mix Node.js, Python and Go, and single-package repositories.
# Checks, builds and tests every change. On push to the default branch it packs the dist units into the
# dist payload, prunes the source units into the source payload and creates releases. Both payloads are
# target-neutral artifacts. The released units are exposed as one release list through the `releases`
# output. Publishing is wired by the caller.

name: App Stack

on:
  workflow_call:
    inputs:
      token-broker-url:
        type: string
        required: false
        default: ""
        description: |-
          URL of the token broker for OIDC token exchange.
          **Default:** Falls back to `vars.TOKEN_BROKER_URL` if not provided.
      default-branch:
        type: string
        required: false
        default: "main"
        description: |-
          Default branch name for the repository.
          **Default:** `main`
          **Example:** `main`, `master`, `develop`
      test-types:
        type: string
        required: false
        default: "unit"
        description: |-
          Comma-separated list of test types to run.
          **Valid values:** `unit`, `integration`, `e2e`
          **Default:** `unit`
          **Example:** `unit,integration,e2e`
      run-unit-tests-in-build:
        type: boolean
        required: false
        default: true
        description: |-
          Run unit tests as part of the check job instead of a separate job.
          Recommended for smaller monorepos to reduce overall execution time.
          **Default:** `true`
          **Note:** You must include `unit` in the `test-types` input for this to have any effect.
      checkout-submodules:
        type: string
        required: false
        default: "false"
        description: |-
          Whether to checkout submodules.
          **Default:** `false`
          **Example:** `true`, `false`, `recursive`
          **Note:** Use `recursive` to recursively checkout submodules
      checkout-token-resources:
        type: string
        required: false
        default: ""
        description: |-
          Additional resources the checkout token must be able to read, whitespace-separated.
          When set, the workflow exchanges its OIDC token at the token broker for an installation token with `contents:read` on this repository plus these resources, and uses it for every checkout.
          **Default:** _empty_ (no exchange; `GITHUB_TOKEN` is used)
          **Format:** `repo:owner/name`, `org:name` or `enterprise:slug`
          **Example:** `repo:my-org/private-submodule repo:my-org/go-lib`
          **Requires:** `token-broker-url` (or the `TOKEN_BROKER_URL` repository variable), and the token broker's GitHub App installed on this repository and every listed resource
          **Note:** Unavailable on pull requests from forks, which have no OIDC token; those runs use `GITHUB_TOKEN`
      prerelease-channel:
        type: string
        required: false
        default: ""
        description: |-
          Prerelease channel name (e.g., "beta", "canary", "rc").
          When set, computes prerelease versions and sets the channel of prerelease entries in the release list.
      source-units:
        type: string
        required: false
        default: "apps/*"
        description: |-
          Units pruned into the source payload, one directory pattern per line.
          `*` matches exactly one path segment and skips dot directories. Only directories with a `package.json` count.
          `.` selects the repository root, which is not pruned: the source payload already holds the whole tree.
          **Default:** `apps/*`
          **Example:** `apps/*` and `services/*` on separate lines
      dist-units:
        type: string
        required: false
        default: "packages/*"
        description: |-
          Units packed into the dist payload, one directory pattern per line.
          `*` matches exactly one path segment and skips dot directories. Only directories with a `package.json` count.
          `.` selects the repository root.
          **Default:** `packages/*`
          **Example:** `packages/*` and `libs/*` on separate lines
      build-selection:
        type: string
        required: false
        default: "all"
        description: |-
          (Beta) Which units are pruned, packed and prereleased on push to the default branch.
          **Valid values:** `all`, `affected`
          **Default:** `all`
          `affected` uses tallyrelease to select the units changed since the last successful run, plus the units depending on them.
          A push that changes `.release-please-manifest.json` selects all units, so stable releases always build.
          **Requires:** `tallyrelease.yaml` in the repository and the `actions: read` permission on the caller for the base lookup
      tallyrelease:
        type: string
        required: false
        default: "off"
        description: |-
          (Beta) Runs tallyrelease next to release-please in the `Release plan` job, which never fails the pipeline.
          **Valid values:** `off`, `shadow`
          **Default:** `off`
          `shadow` runs `tallyrelease plan` on every run (artifact `tallyrelease-plan`) and, on push to the default branch, `tallyrelease shadow`, which compares tallyrelease with release-please on release merges (artifact `tallyrelease-shadow`), and a read-only release dry run, `tallyrelease run --dry-run` with a token broker read token (artifact `tallyrelease-run`). All write a step summary.
          **Requires:** `tallyrelease.yaml` in the repository. No permissions beyond the ones listed in the README.
      shadow-issue:
        type: string
        required: false
        default: ""
        description: |-
          (Beta) Issue number that receives one comment per compared release merge. Only with `tallyrelease: shadow`.
          **Default:** _empty_ (no comment)
          **Requires:** the token broker allows `issues:write` on this repository

    outputs:
      releases:
        value: ${{ jobs.release.outputs.releases || '[]' }}
        description: |-
          Release list (schema 1), a compact JSON array with one entry per released unit, for publish workflows such as `publish-oci` and `publish-npm`.
          Each entry: {schema: 1, name, path, version, channel, sha, url?, payloads}. `url` is the GitHub release URL when the unit has its own release. `name` is the directory basename, the repository name for the root unit `.`.
          `payloads.source` is set for source units, `payloads.dist` for dist units.
          `[]` when nothing was released.

permissions: {}

env:
  NODE_OPTIONS: "--max-old-space-size=4096"

defaults:
  run:
    shell: bash

jobs:
  # Resolve the event, validate the repository, resolve the units and discover test types.
  configure:
    name: Configure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      # Commit SHA to check out.
      commit-sha: ${{ steps.event.outputs.commit-sha }}

      # Pipeline mode (pr, main or none).
      mode: ${{ steps.event.outputs.mode }}

      # Units as compact JSON arrays of {path, name}, path `.` for the repository root.
      # With build-selection `affected` on the default branch they only hold the affected units.
      source-units: ${{ steps.select.outputs.source-units || steps.source-units.outputs.items }}
      dist-units: ${{ steps.select.outputs.dist-units || steps.dist-units.outputs.items }}

      # Paths of the affected units as a JSON array, `null` when all units are selected.
      affected-paths: ${{ steps.select.outputs.affected-paths }}

      # Test types to run.
      test-types: ${{ steps.evaluate.outputs.test_types }}
      test-types-for-matrix: ${{ steps.evaluate.outputs.test_types_for_matrix }}
    steps:
      - name: Validate inputs
        env:
          INPUT_BUILD_SELECTION: ${{ inputs.build-selection }}
          INPUT_TALLYRELEASE: ${{ inputs.tallyrelease }}
          INPUT_SHADOW_ISSUE: ${{ inputs.shadow-issue }}
        run: |
          if [[ "$INPUT_BUILD_SELECTION" != "all" && "$INPUT_BUILD_SELECTION" != "affected" ]]; then
            echo "::error::Invalid build-selection '$INPUT_BUILD_SELECTION'. Valid values: all, affected"
            exit 1
          fi
          if [[ "$INPUT_TALLYRELEASE" != "off" && "$INPUT_TALLYRELEASE" != "shadow" ]]; then
            echo "::error::Invalid tallyrelease '$INPUT_TALLYRELEASE'. Valid values: off, shadow"
            exit 1
          fi
          if [[ -n "$INPUT_SHADOW_ISSUE" && ! "$INPUT_SHADOW_ISSUE" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Invalid shadow-issue '$INPUT_SHADOW_ISSUE'. Expected an issue number"
            exit 1
          fi
          if [[ -n "$INPUT_SHADOW_ISSUE" && "$INPUT_TALLYRELEASE" == "off" ]]; then
            echo "::warning::shadow-issue has no effect while tallyrelease is off"
          fi

      # Resolve the commit SHA and mode for this event.
      - name: Evaluate event
        id: event
        uses: abinnovision/actions@evaluate-event-dev
        with:
          default-branch: ${{ inputs.default-branch }}

      # Check out the root files of the resolved commit only; unit discovery reads the git tree.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.event.outputs.commit-sha }}
          submodules: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/

      # Optional: without a Makefile, dependencies are installed with `yarn install --immutable`.
      - name: Validate Makefile
        run: |
          if [ ! -f "Makefile" ]; then
            echo "No Makefile, installing with 'yarn install --immutable'"
            exit 0
          fi
          if ! grep -qE '^install-immutable:' Makefile; then
            echo "::error::Makefile missing required 'install-immutable' target"
            exit 1
          fi

      # Every directory matching a source-units pattern that contains a package.json is a source unit.
      - name: Resolve source units
        id: source-units
        uses: abinnovision/actions@match-paths-dev
        with:
          marker: package.json
          patterns: ${{ inputs.source-units }}
          unique: name

      # Every directory matching a dist-units pattern that contains a package.json is a dist unit.
      - name: Resolve dist units
        id: dist-units
        uses: abinnovision/actions@match-paths-dev
        with:
          marker: package.json
          patterns: ${{ inputs.dist-units }}
          unique: name

      # tallyrelease reads every unit's package.json, so the sparse tree is replaced by the full history.
      - name: Checkout full history
        if: inputs.build-selection == 'affected' && steps.event.outputs.mode == 'main'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.event.outputs.commit-sha }}
          submodules: false
          fetch-depth: 0
          filter: blob:none

      - name: Disable sparse checkout
        if: inputs.build-selection == 'affected' && steps.event.outputs.mode == 'main'
        run: git sparse-checkout disable

      - name: Find affected units
        id: affected
        if: inputs.build-selection == 'affected' && steps.event.outputs.mode == 'main'
        uses: abinnovision/actions@run-tallyrelease-dev
        with:
          args: affected

      # A push that changes the release-please manifest releases units, which must all be built.
      - name: Select units
        id: select
        if: inputs.build-selection == 'affected' && steps.event.outputs.mode == 'main'
        env:
          RESULT: ${{ steps.affected.outputs.result }}
          SOURCE_UNITS: ${{ steps.source-units.outputs.items }}
          DIST_UNITS: ${{ steps.dist-units.outputs.items }}
        run: |
          set -euo pipefail

          ALL=$(jq -r '.build.all' <<< "$RESULT")
          BASE=$(jq -r '.build.base // empty' <<< "$RESULT")

          select_all=false
          if [[ "$ALL" == "true" || -z "$BASE" ]]; then
            select_all=true
          elif ! manifest_diff=$(git diff --name-only "$BASE" HEAD -- .release-please-manifest.json) || [[ -n "$manifest_diff" ]]; then
            select_all=true
          fi

          if [[ "$select_all" == "true" ]]; then
            echo "Selecting all units"
            affected_paths=null
          else
            affected_paths=$(jq -c '[.units[].path]' <<< "$RESULT")
            SOURCE_UNITS=$(jq -c --argjson paths "$affected_paths" '[.[] | select(.path | IN($paths[]))]' <<< "$SOURCE_UNITS")
            DIST_UNITS=$(jq -c --argjson paths "$affected_paths" '[.[] | select(.path | IN($paths[]))]' <<< "$DIST_UNITS")
            echo "Selecting affected units: $affected_paths"
          fi

          echo "Source units: $SOURCE_UNITS"
          echo "Dist units: $DIST_UNITS"
          {
            echo "source-units=$SOURCE_UNITS"
            echo "dist-units=$DIST_UNITS"
            echo "affected-paths=$affected_paths"
          } >> "$GITHUB_OUTPUT"

      # Parse test types.
      - name: Evaluate
        id: evaluate
        env:
          INPUT_TEST_TYPES: ${{ inputs.test-types }}
          INPUT_RUN_UNIT_TESTS_IN_BUILD: ${{ inputs.run-unit-tests-in-build }}
        run: |
          # Parse and validate test types
          test_types=()
          test_types_for_matrix=()
          valid_types=("unit" "integration" "e2e")

          if [ -n "$INPUT_TEST_TYPES" ]; then
            IFS=',' read -ra types <<< "$INPUT_TEST_TYPES"
            for type in "${types[@]}"; do
              # Trim whitespace
              type=$(echo "$type" | xargs)

              # Validate type
              if [[ " ${valid_types[@]} " =~ " ${type} " ]]; then
                test_types+=("$type")

                # Exclude unit tests from matrix if they run in the check job
                if [[ "$type" == "unit" && "$INPUT_RUN_UNIT_TESTS_IN_BUILD" == "true" ]]; then
                  echo "Unit tests will run in the check job, excluding from test matrix"
                else
                  test_types_for_matrix+=("$type")
                fi
              else
                echo "::warning::Invalid test type '$type' - skipping. Valid types: unit, integration, e2e"
              fi
            done
          fi

          # Convert to JSON using jq
          test_types_json=$(printf '%s\n' "${test_types[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          test_types_matrix_json=$(printf '%s\n' "${test_types_for_matrix[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0))')

          echo "test_types=$test_types_json" >> $GITHUB_OUTPUT
          echo "test_types_for_matrix=$test_types_matrix_json" >> $GITHUB_OUTPUT

          # Debug output
          echo "All test types: $test_types_json"
          echo "Test types for matrix: $test_types_matrix_json"

  # Install, build and check. Builds first so linter config in compiled workspace packages is available.
  # On push to the default branch it also prunes the source units into the source payload and packs the
  # dist units into the dist payload.
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - configure
    permissions:
      contents: read
      packages: read
      actions: write
      id-token: write
    steps:
      - &checkout-token
        id: checkout-token
        name: Exchange token for checkout
        if: >-
          inputs.checkout-token-resources != ''
          && (github.event.pull_request == null
          || github.event.pull_request.head.repo.full_name == github.repository)
        uses: abinnovision/actions@exchange-github-token-dev
        with:
          broker-url: ${{ inputs.token-broker-url || vars.TOKEN_BROKER_URL }}
          resources: "repo:${{ github.repository }} ${{ inputs.checkout-token-resources }}"
          scope: contents:read

      - &checkout
        name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.configure.outputs.commit-sha }}
          submodules: ${{ inputs.checkout-submodules }}
          token: ${{ steps.checkout-token.outputs.token || github.token }}
          persist-credentials: false
      - name: Setup Tools
        uses: abinnovision/actions@setup-tools-dev

      # Runs before install and build so the pruned trees only contain tracked sources.
      - name: Prune source units
        if: needs.configure.outputs.mode == 'main' && needs.configure.outputs.source-units != '[]'
        env:
          SOURCE_UNITS: ${{ needs.configure.outputs.source-units }}
        run: |
          set -euo pipefail

          # The root unit is not pruned, the payload already holds the whole tree.
          units=$(jq -c '[.[] | select(.path != ".")]' <<< "$SOURCE_UNITS")

          if [[ $(jq 'length' <<< "$units") -gt 0 ]]; then
            # Get turbo version from package.json (required to prune)
            TURBO_VERSION=$(jq -r '.devDependencies.turbo // .dependencies.turbo // empty' package.json)

            if [ -z "$TURBO_VERSION" ]; then
              echo "::error::Turbo not found in package.json devDependencies or dependencies"
              exit 1
            fi

            echo "Turbo version: $TURBO_VERSION"
          fi

          while IFS=$'\t' read -r unit name; do
            # Package name of the unit, used as the prune scope
            scope=$(jq -r '.name // empty' "$unit/package.json")
            if [[ -z "$scope" ]]; then
              echo "::error::Package name not found in $unit/package.json"
              exit 1
            fi

            # Outside the workspace so later check steps don't pick up the pruned trees.
            echo "Running turbo prune for scope: $scope"
            yarn dlx turbo@"$TURBO_VERSION" prune --scope="$scope" --docker --out-dir="$RUNNER_TEMP/out/$name"
          done < <(jq -r '.[] | [.path, .name] | @tsv' <<< "$units")

          # Tracked source tree (including submodules) plus the pruned unit trees under out/.
          git ls-files --recurse-submodules -z | tar --null -T - -cf "$RUNNER_TEMP/source.tar"
          if [[ -d "$RUNNER_TEMP/out" ]]; then
            tar -rf "$RUNNER_TEMP/source.tar" -C "$RUNNER_TEMP" out
          fi
          ls -lh "$RUNNER_TEMP/source.tar"

      - name: Upload source payload
        if: needs.configure.outputs.mode == 'main' && needs.configure.outputs.source-units != '[]'
        uses: actions/upload-artifact@v7
        with:
          name: payload-source
          path: ${{ runner.temp }}/source.tar
          retention-days: 7
          if-no-files-found: error
          # Allows re-running the job within the same workflow run.
          overwrite: true

      - &install
        name: Install dependencies
        run: |
          if [[ -f Makefile ]]; then
            make install-immutable
          else
            yarn install --immutable
          fi
      - name: Check dependencies
        run: |
          yarn dedupe --check || (echo "yarn.lock is not up to date, run 'yarn dedupe'" && exit 1)
          if jq -e '.devDependencies.turbo // .dependencies.turbo' package.json > /dev/null; then
            yarn turbo boundaries || (echo "turbo boundaries failed" && exit 1)
          fi
      - name: Build
        run: yarn run build
      - name: Check
        run: yarn run check
      - name: Unit Tests
        if: ${{ inputs.run-unit-tests-in-build && contains(fromJSON(needs.configure.outputs.test-types), 'unit') }}
        run: yarn run test-unit

      # One version-free tarball per dist unit, named after the directory basename or, for the root, the repository.
      - name: Pack dist units
        if: needs.configure.outputs.mode == 'main' && needs.configure.outputs.dist-units != '[]'
        env:
          DIST_UNITS: ${{ needs.configure.outputs.dist-units }}
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/dist"
          while IFS=$'\t' read -r unit name; do
            (cd "$unit" && yarn pack --out "$RUNNER_TEMP/dist/$name.tgz")
          done < <(jq -r '.[] | [.path, .name] | @tsv' <<< "$DIST_UNITS")

      - name: Upload dist payload
        if: needs.configure.outputs.mode == 'main' && needs.configure.outputs.dist-units != '[]'
        uses: actions/upload-artifact@v7
        with:
          name: payload-dist
          path: ${{ runner.temp }}/dist
          retention-days: 7
          if-no-files-found: error
          # Allows re-running the job within the same workflow run.
          overwrite: true

  # Run tests in parallel per type (unit tests excluded if run-unit-tests-in-build is set).
  # Runs concurrently with check: neither job consumes build artifacts from the other.
  test:
    name: "Test: ${{ matrix.test-type }}"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs:
      - configure
    if: ${{ fromJSON(needs.configure.outputs.test-types-for-matrix)[0] != null }}
    strategy:
      fail-fast: false
      matrix:
        test-type: ${{ fromJSON(needs.configure.outputs.test-types-for-matrix) }}
    permissions:
      contents: read
      packages: read
      actions: write
      id-token: write
    steps:
      - *checkout-token
      - *checkout
      - name: Setup Tools
        uses: abinnovision/actions@setup-tools-dev
      - *install
      - name: Build
        run: yarn run build

      # Requires test-* scripts in root package.json.
      - name: Run ${{ matrix.test-type }} tests
        env:
          TEST_TYPE: ${{ matrix.test-type }}
        run: yarn run "test-$TEST_TYPE"

  # Create releases with release-please and emit the release list (schema 1) with one entry per released unit.
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - configure
      - check
      - test
    # Only on push to the default branch, after a successful check and a successful or skipped test job.
    # always() prevents skipping when the test job is skipped.
    if: >-
      always()
      && needs.configure.outputs.mode == 'main'
      && needs.check.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.test.result)
    permissions:
      contents: read
      id-token: write
    outputs:
      releases: ${{ steps.releases.outputs.releases }}
    # No checkout: release-please reads the repository through the GitHub API.
    steps:
      - id: token
        name: Exchange token for release
        uses: abinnovision/actions@exchange-github-token-dev
        with:
          broker-url: ${{ inputs.token-broker-url || vars.TOKEN_BROKER_URL }}
          scope: contents:write pull_requests:write

      - id: release
        name: Run release-please
        uses: abinnovision/actions@run-release-please-dev
        with:
          token: ${{ steps.token.outputs.token }}
          target-branch: ${{ inputs.default-branch }}
          prerelease-channel: ${{ inputs.prerelease-channel }}

      # `[]` when release-please released nothing. With build-selection `affected`, prereleases of unaffected units are dropped.
      - id: releases
        name: Write release list
        env:
          VERSIONS: ${{ steps.release.outputs.versions }}
          SOURCE_UNITS: ${{ needs.configure.outputs.source-units }}
          DIST_UNITS: ${{ needs.configure.outputs.dist-units }}
          AFFECTED_PATHS: ${{ needs.configure.outputs.affected-paths || 'null' }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          INPUT_PRERELEASE_CHANNEL: ${{ inputs.prerelease-channel }}
        run: |
          set -euo pipefail

          releases=$(jq -c \
            --argjson source "$SOURCE_UNITS" \
            --argjson dist "$DIST_UNITS" \
            --argjson affected "$AFFECTED_PATHS" \
            --arg root "$REPOSITORY_NAME" \
            --arg channel "$INPUT_PRERELEASE_CHANNEL" \
            '[to_entries[] | .key as $path | (if $path == "." then $root else $path | split("/") | last end) as $name | {
              schema: 1,
              name: $name,
              path: $path,
              version: .value.packageVersion,
              channel: (if .value.type == "prerelease" then $channel else "" end),
              sha: .value.sha,
              url: .value.url,
              payloads: (
                (if $path | IN($source[].path) then {source: {artifact: "payload-source", file: "source.tar"}} else {} end)
                + (if $path | IN($dist[].path) then {dist: {artifact: "payload-dist", file: "\($name).tgz"}} else {} end)
              )
            } | if .url == null then del(.url) else . end
              | select(.channel == "" or $affected == null or (.path | IN($affected[])))]' <<< "$VERSIONS")

          echo "releases=$releases" >> "$GITHUB_OUTPUT"
          echo "Releases: $releases"

  # Plans releases with tallyrelease and, on push to the default branch, compares them with release-please.
  # Observe only: every step may fail without failing the job, and `Status` does not need it.
  release-plan:
    name: Release plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - configure
    if: inputs.tallyrelease == 'shadow' && needs.configure.outputs.mode != 'none'
    permissions:
      contents: read
      # Base lookup (last successful run) for plan on push.
      actions: read
      # Token exchange for the shadow issue comment and the release dry run.
      id-token: write
    steps:
      # Full history for tags, HEAD^1 and the base; blobs are fetched on demand, which needs the persisted
      # credentials on private repositories. No repository code runs in this job.
      - name: Checkout
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.configure.outputs.commit-sha }}
          submodules: false
          fetch-depth: 0
          filter: blob:none

      # Plans for the default branch on pull requests too, so reviewers see what merging would release.
      - name: Plan
        id: plan
        continue-on-error: true
        uses: abinnovision/actions@run-tallyrelease-dev
        with:
          args: |
            plan
            --branch
            ${{ inputs.default-branch }}
            --all
            --summary

      - name: Upload plan
        if: steps.plan.outputs.result-file != ''
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: tallyrelease-plan
          path: ${{ steps.plan.outputs.result-file }}
          retention-days: 7
          # Allows re-running the job within the same workflow run.
          overwrite: true

      # Skipped with W_SHADOW_SKIPPED unless the push changed the release-please manifest.
      - name: Shadow
        id: shadow
        if: needs.configure.outputs.mode == 'main'
        continue-on-error: true
        uses: abinnovision/actions@run-tallyrelease-dev
        with:
          args: |
            shadow
            --branch
            ${{ inputs.default-branch }}
            --summary

      - name: Upload shadow report
        if: steps.shadow.outputs.result-file != ''
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: tallyrelease-shadow
          path: ${{ steps.shadow.outputs.result-file }}
          retention-days: 90
          # Allows re-running the job within the same workflow run.
          overwrite: true

      # Skipped reports get no comment.
      - name: Render shadow comment
        id: comment
        if: steps.shadow.outputs.result-file != '' && inputs.shadow-issue != ''
        continue-on-error: true
        env:
          REPORT: ${{ steps.shadow.outputs.result-file }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          set -euo pipefail

          if ! jq -e '.skipped == null' "$REPORT" > /dev/null; then
            echo "Shadow report skipped, no comment"
            exit 0
          fi

          jq -r --arg run "$RUN_URL" '
            "### tallyrelease shadow `\(.head[0:7])`",
            "",
            "Planned `\(.planned[0:7])` on `\(.branch)`, pin `\(.pin)`. [Run](\($run))",
            "",
            "| Path | Unit | Status | Before | release-please | tallyrelease | Labels |",
            "| :-- | :-- | :-- | :-- | :-- | :-- | :-- |",
            (.rows[] | "| `\(.path)` | \(.unit // "-") | \(.status) | \(.before // "-") | \(.after // "-") | \(.next // "-") | \(.labels | join(", ") | if . == "" then "-" else . end) |")
          ' "$REPORT" > "$RUNNER_TEMP/shadow-comment.md"
          echo "body=$RUNNER_TEMP/shadow-comment.md" >> "$GITHUB_OUTPUT"

      - id: issue-token
        name: Exchange token for the shadow issue
        if: steps.comment.outputs.body != ''
        continue-on-error: true
        uses: abinnovision/actions@exchange-github-token-dev
        with:
          broker-url: ${{ inputs.token-broker-url || vars.TOKEN_BROKER_URL }}
          scope: issues:write

      - name: Comment on the shadow issue
        if: steps.issue-token.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.issue-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          SHADOW_ISSUE: ${{ inputs.shadow-issue }}
          BODY: ${{ steps.comment.outputs.body }}
        run: gh issue comment "$SHADOW_ISSUE" --body-file "$BODY"

      # The job token cannot read issues and pull requests, so the dry run uses a read-only broker token.
      - id: dry-run-token
        name: Exchange token for the release dry run
        if: needs.configure.outputs.mode == 'main'
        continue-on-error: true
        uses: abinnovision/actions@exchange-github-token-dev
        with:
          broker-url: ${{ inputs.token-broker-url || vars.TOKEN_BROKER_URL }}
          scope: contents:read issues:read pull_requests:read actions:read

      # Shows the release PRs, tags and releases tallyrelease would create; writes nothing.
      - name: Release dry run
        id: dry-run
        if: steps.dry-run-token.outcome == 'success'
        continue-on-error: true
        uses: abinnovision/actions@run-tallyrelease-dev
        with:
          token: ${{ steps.dry-run-token.outputs.token }}
          args: |
            run
            --branch
            ${{ inputs.default-branch }}
            --dry-run
            --summary

      - name: Upload release dry run
        if: steps.dry-run.outputs.result-file != ''
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: tallyrelease-run
          path: ${{ steps.dry-run.outputs.result-file }}
          retention-days: 7
          # Allows re-running the job within the same workflow run.
          overwrite: true

  # Single required status check for rulesets.
  status:
    name: Status
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [configure, check, test, release]
    if: always()
    permissions: {}
    steps:
      - name: Evaluate status
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
