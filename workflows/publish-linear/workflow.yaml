name: Publish Linear

on:
  workflow_call:
    secrets:
      LINEAR_ACCESS_KEYS:
        required: true
        description: |-
          Linear release pipeline access keys in **CSV format** (one per line).
          **Format:** `item,access-key`
          `item` is a tallyrelease release item: the fixed `group` of an entry, or its unit `id` when the entry has no
          group. Each item may appear once. Entries whose item has no line are skipped.
          **Example:**
          ```
          backend,lin_api_abc123
          ```

    inputs:
      releases:
        type: string
        required: true
        description: |-
          Release list v2 of a stack as a JSON array, the `releases` output of a stack.
          Entries of kind `release` are synced to Linear; prereleases are ignored.
          An empty string or `[]` skips all work.
          **Example:** `needs.ci.outputs.releases`

      maintenance:
        type: boolean
        required: false
        default: false
        description: |-
          Also sync releases of runs on branches other than the default branch, i.e. maintenance lines. Entries carry no
          line, so the branch of the run decides.
          **Default:** `false`

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  # Assigns the releases to access keys and groups them into one Linear release per item and version. Keys never leave
  # this job; each group carries the index of its key line instead.
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: inputs.releases != '' && inputs.releases != '[]'
    permissions: {}
    outputs:
      groups: ${{ steps.group.outputs.groups }}
    steps:
      - name: Group releases
        id: group
        env:
          RELEASES: ${{ inputs.releases }}
          LINEAR_ACCESS_KEYS: ${{ secrets.LINEAR_ACCESS_KEYS }}
          INPUT_MAINTENANCE: ${{ inputs.maintenance }}
          DEFAULT_LINE: ${{ github.ref_name == github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          # Errors name the line number only, never its content.
          errors=$(
            jq -rn '
              $ENV.LINEAR_ACCESS_KEYS | split("\n") | map(gsub("^\\s+|\\s+$"; ""))
              | to_entries[] | select(.value != "" and (.value | test("^[^,]+,.+$") | not))
              | "Invalid LINEAR_ACCESS_KEYS line \(.key + 1): expected \u0027item,access-key\u0027"
            '
            jq -rn '
              $ENV.LINEAR_ACCESS_KEYS | split("\n") | map(gsub("^\\s+|\\s+$"; ""))
              | to_entries | map(select(.value | test("^[^,]+,.+$"))
                | {line: (.key + 1), item: (.value | split(",")[0] | gsub("\\s+$"; ""))})
              | group_by(.item)[] | select(length > 1)
              | "LINEAR_ACCESS_KEYS lines \(map(.line) | join(", ")) hold the same item"
            '
            jq -r '
              .[] | select(has("latest") | not)
              | "Entry \(.id // .path) is not a release list v2 entry (missing latest)"
            ' <<< "$RELEASES"
          )

          if [[ -n "$errors" ]]; then
            while IFS= read -r error; do
              echo "::error::$error"
            done <<< "$errors"
            exit 1
          fi

          if [[ "$INPUT_MAINTENANCE" != "true" && "$DEFAULT_LINE" != "true" ]]; then
            echo "::notice::$GITHUB_REF_NAME is not the default branch and maintenance is false, nothing to sync"
            echo "groups=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # One group per item and version, in list order (oldest release first). A fixed group releases together, so
          # its entries of one version share the release commit.
          groups=$(jq -c '
            ($ENV.LINEAR_ACCESS_KEYS | split("\n") | map(gsub("^\\s+|\\s+$"; ""))
              | to_entries
              | map(select(.value != "") | {(.value | split(",")[0] | gsub("\\s+$"; "")): .key})
              | add // {}
            ) as $lines

            | [.[] | select(.kind == "release") | (.group // .id) as $item
                | select($lines[$item] != null)
                | . + {item: $item, keyLine: $lines[$item]}]
            | . as $entries
            | reduce (.[] | [.item, .version]) as $k ([]; if any(.[]; . == $k) then . else . + [$k] end)
            | map(. as [$item, $version] | [$entries[] | select(.item == $item and .version == $version)] | {
                keyLine: .[0].keyLine,
                item: $item,
                version: $version,
                units: (map(.id) | join(", ")),
                sha: .[0].releaseSha,
                prs: ([.[].prs[]?] | unique),
                links: map(select(.forge.release.url) | {label: "\(.id) v\(.version)", url: .forge.release.url})
              })
          ' <<< "$RELEASES")

          echo "groups=$groups" >> "$GITHUB_OUTPUT"

          if [[ "$groups" == "[]" ]]; then
            echo "No release matches a LINEAR_ACCESS_KEYS line, nothing to sync"
          else
            jq -r '.[] | "Group \(.item) v\(.version): \(.units)"' <<< "$groups"
          fi

  # Creates or updates one Linear release per group, one at a time in list order. Linear resolves the issues linked to
  # the pull requests.
  sync:
    name: "Sync: ${{ matrix.group.units }} v${{ matrix.group.version }}"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: prepare
    if: needs.prepare.outputs.groups != '[]' && needs.prepare.outputs.groups != ''
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        group: ${{ fromJSON(needs.prepare.outputs.groups) }}
    permissions: {}
    steps:
      - name: Resolve access key
        id: key
        env:
          KEY_LINE: ${{ matrix.group.keyLine }}
          LINEAR_ACCESS_KEYS: ${{ secrets.LINEAR_ACCESS_KEYS }}
        run: |
          set -euo pipefail

          key=$(jq -rn --argjson line "$KEY_LINE" '
            $ENV.LINEAR_ACCESS_KEYS | split("\n") | map(gsub("^\\s+|\\s+$"; ""))
            | .[$line] | capture("^[^,]+,(?<key>.+)$").key | gsub("^\\s+"; "")
          ')

          echo "::add-mask::$key"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Sync release
        id: sync
        env:
          ACCESS_KEY: ${{ steps.key.outputs.key }}
          GROUP: ${{ toJSON(matrix.group) }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail

          request=$(jq -nc \
            --arg owner "${GITHUB_REPOSITORY%%/*}" \
            --arg repo "${GITHUB_REPOSITORY#*/}" \
            --arg repo_url "$REPOSITORY_URL" \
            --arg run_url "$REPOSITORY_URL/actions/runs/$GITHUB_RUN_ID" \
            --argjson group "$GROUP" '
            {
              query: "mutation ($input: ReleaseSyncInputBase!) { releaseSyncByAccessKey(input: $input) { success release { name url } } }",
              variables: {input: {
                name: "v\($group.version)",
                version: $group.version,
                commitSha: $group.sha,
                pullRequestReferences: $group.prs | map({repositoryOwner: $owner, repositoryName: $repo, number: .}),
                repository: {owner: $owner, name: $repo, provider: "github", url: $repo_url},
                links: ($group.links + [{label: "Workflow run", url: $run_url}])
              }}
            }')

          response=$(curl -sS --fail-with-body --retry 3 \
            -H "Authorization: $ACCESS_KEY" \
            -H "Content-Type: application/json" \
            --data-binary @- https://api.linear.app/graphql <<< "$request") || {
            echo "::error::Linear request failed: $response"
            exit 1
          }

          errors=$(jq -r '.errors[]?.message' <<< "$response")
          if [[ -n "$errors" ]] || ! jq -e '.data.releaseSyncByAccessKey.success' <<< "$response" > /dev/null; then
            while IFS= read -r error; do
              echo "::error::Linear: ${error:-sync did not succeed}"
            done <<< "${errors:-}"
            exit 1
          fi

          url=$(jq -r '.data.releaseSyncByAccessKey.release.url' <<< "$response")
          echo "release-url=$url" >> "$GITHUB_OUTPUT"
          echo "Synced $(jq -r '.data.releaseSyncByAccessKey.release.name' <<< "$response"): $url"

      - name: Write summary
        env:
          ITEM: ${{ matrix.group.item }}
          VERSION: ${{ matrix.group.version }}
          PRS: ${{ toJSON(matrix.group.prs) }}
          RELEASE_URL: ${{ steps.sync.outputs.release-url }}
        run: |
          prs=$(jq -r 'map("#\(.)") | join(", ")' <<< "$PRS")
          {
            echo "### Linear release"
            echo ""
            echo "| Item | Version | Pull requests | Release |"
            echo "| :--- | :------ | :------------ | :------ |"
            echo "| $ITEM | \`$VERSION\` | ${prs:-none} | ${RELEASE_URL:-none} |"
          } >> "$GITHUB_STEP_SUMMARY"
