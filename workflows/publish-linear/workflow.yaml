name: Publish Linear

on:
  workflow_call:
    secrets:
      LINEAR_ACCESS_KEYS:
        required: true
        description: |-
          Linear release pipeline access keys in **CSV format** (one per line).
          **Format:** `unit,access-key`
          `unit` is a tallyrelease unit id, matched against the entry `id`; each unit may appear once. Entries without a
          line are skipped. Units whose lines hold the same key are synced as one Linear release and must share the
          version.
          **Example:**
          ```
          backend,lin_api_abc123
          web,lin_api_abc123
          ```

    inputs:
      releases:
        type: string
        required: true
        description: |-
          Release list (schema 1) of a stack as a JSON array, the `releases` output of a stack released with
          tallyrelease. Stable entries (empty `channel`) are synced to Linear; prereleases are ignored. Every synced
          entry needs `prs`.
          An empty string or `[]` skips all work.
          **Example:** `needs.ci.outputs.releases`

      maintenance:
        type: boolean
        required: false
        default: false
        description: |-
          Also sync entries of maintenance lines (`line: maintenance`). Entries without `line` are always synced.
          **Default:** `false`

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  # Assigns the stable entries to access keys and groups them into one Linear release per key. Keys never leave this
  # job; each group carries the index of its key line instead.
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 2
    if: inputs.releases != '' && inputs.releases != '[]'
    permissions: {}
    outputs:
      groups: ${{ steps.group.outputs.groups }}
    steps:
      - name: Group releases
        id: group
        env:
          RELEASES: ${{ inputs.releases }}
          LINEAR_ACCESS_KEYS: ${{ secrets.LINEAR_ACCESS_KEYS }}
          INPUT_MAINTENANCE: ${{ inputs.maintenance }}
        run: |
          set -euo pipefail

          # Errors name the line number only, never its content.
          errors=$(
            jq -rn '
              $ENV.LINEAR_ACCESS_KEYS | split("\n") | map(gsub("^\\s+|\\s+$"; ""))
              | to_entries[] | select(.value != "" and (.value | test("^[^,]+,.+$") | not))
              | "Invalid LINEAR_ACCESS_KEYS line \(.key + 1): expected \u0027unit,access-key\u0027"
            '
            jq -rn '
              $ENV.LINEAR_ACCESS_KEYS | split("\n") | map(gsub("^\\s+|\\s+$"; "") | select(test("^[^,]+,.+$")) | split(",")[0] | gsub("\\s+$"; ""))
              | group_by(.)[] | select(length > 1)
              | "Unit \(.[0]) appears in several LINEAR_ACCESS_KEYS lines"
            '
            jq -r '
              .[]
              | (select(.schema != 1) | "Entry \(.path) has schema \(.schema // "none"), this workflow supports schema 1"),
                (select(.channel == "" and .id == null)
                  | "Entry \(.path) has no id, publish-linear needs a release list from tallyrelease")
            ' <<< "$RELEASES"
          )

          if [[ -n "$errors" ]]; then
            while IFS= read -r error; do
              echo "::error::$error"
            done <<< "$errors"
            exit 1
          fi

          groups=$(jq -c --argjson maintenance "$INPUT_MAINTENANCE" '
            ($ENV.LINEAR_ACCESS_KEYS | split("\n") | map(gsub("^\\s+|\\s+$"; ""))
              | to_entries
              | map(select(.value != ""))
              | map((.value | capture("^(?<unit>[^,]+),(?<key>.+)$")) as $c | {
                  line: .key,
                  unit: ($c.unit | gsub("\\s+$"; "")),
                  key: ($c.key | gsub("^\\s+"; ""))
                })
            ) as $lines

            # Lines holding the same key share the index of its first line.
            | ($lines | map({(.key): .line}) | reverse | add // {}) as $first

            # A list may hold several releases of a unit (catch-ups); the highest version wins and carries the pull
            # requests of all of them.
            | [.[] | select(.channel == "" and ($maintenance or .line != "maintenance"))]
            | . as $stable
            | [.[] | . as $entry | ($stable | map(select(.id == $entry.id))) as $same
                | select($entry == ($same | max_by(.version | split(".") | map(tonumber? // .))))
                | $entry + (if all($same[]; .prs != null) then {prs: ($same | map(.prs) | add | unique)} else {} end)]
            | [.[] | . as $entry
                | first($lines[] | select(.unit == $entry.id)) as $match
                | $entry + {keyLine: $first[$match.key]}]
            | group_by(.keyLine)
            | map({
                keyLine: .[0].keyLine,
                name: (map(.name) | join(", ")),
                version: .[0].version,
                versions: (map(.version) | unique),
                missing: map(select(.prs == null) | .name),
                prs: (map(.prs // []) | add | unique),
                links: map(select(.url) | {label: "\(.name) v\(.version)", url}),
                notes: map(select(.url) | {name, version, tag}),
                # The list is ordered oldest release commit first.
                sha: (last | .releaseSha)
              } + (map(.name) as $names | map(.releaseSha) | unique
                | if length > 1 then {warning: "Entries \($names | join(", ")) have different release commits, syncing at the newest"}
                  else {} end))
          ' <<< "$RELEASES")

          jq -r '.[] | select(.warning) | "::warning::\(.warning)"' <<< "$groups"

          errors=$(jq -r '
            .[]
            | (select(.versions | length > 1)
                | "Entries \(.name) share an access key but have different versions: \(.versions | join(", "))"),
              (.missing[] | "Entry \(.) has no prs, publish-linear needs a release list from tallyrelease")
          ' <<< "$groups")

          if [[ -n "$errors" ]]; then
            while IFS= read -r error; do
              echo "::error::$error"
            done <<< "$errors"
            exit 1
          fi

          echo "groups=$groups" >> "$GITHUB_OUTPUT"

          if [[ "$groups" == "[]" ]]; then
            echo "No stable entries match a LINEAR_ACCESS_KEYS line, nothing to sync"
          else
            jq -r '.[] | "Group \(.name): \(.version)"' <<< "$groups"
          fi

  # Creates or updates one Linear release per group. Linear resolves the issues linked to the pull requests.
  sync:
    name: "Sync: ${{ matrix.group.name }}"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: prepare
    if: needs.prepare.outputs.groups != '[]' && needs.prepare.outputs.groups != ''
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.prepare.outputs.groups) }}
    permissions:
      contents: read
    steps:
      - name: Resolve access key
        id: key
        env:
          KEY_LINE: ${{ matrix.group.keyLine }}
          LINEAR_ACCESS_KEYS: ${{ secrets.LINEAR_ACCESS_KEYS }}
        run: |
          set -euo pipefail

          key=$(jq -rn --argjson line "$KEY_LINE" '
            $ENV.LINEAR_ACCESS_KEYS | split("\n") | map(gsub("^\\s+|\\s+$"; ""))
            | .[$line] | capture("^[^,]+,(?<key>.+)$").key | gsub("^\\s+"; "")
          ')

          echo "::add-mask::$key"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      # The GitHub release bodies become the release notes, headed per entry when the group has several. A failed
      # lookup only skips that entry.
      - name: Write release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ toJSON(matrix.group.notes) }}
        run: |
          set -euo pipefail

          file="$RUNNER_TEMP/release-notes.md"
          count=$(jq 'length' <<< "$NOTES")
          : > "$file"

          while IFS=$'\t' read -r name version tag; do
            if ! body=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json body --jq .body); then
              echo "::warning::Could not read the GitHub release $tag, skipping its release notes"
              continue
            fi

            if [[ -z "$body" ]]; then
              continue
            fi

            if (( count > 1 )); then
              printf '## %s v%s\n\n' "$name" "$version" >> "$file"
            fi
            printf '%s\n\n' "$body" >> "$file"
          done < <(jq -r '.[] | [.name, .version, .tag] | @tsv' <<< "$NOTES")

          if [[ -s "$file" ]]; then
            echo "path=$file" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync release
        id: sync
        env:
          ACCESS_KEY: ${{ steps.key.outputs.key }}
          GROUP: ${{ toJSON(matrix.group) }}
          NOTES_FILE: ${{ steps.notes.outputs.path }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          request=$(jq -n \
            --arg owner "${GITHUB_REPOSITORY%%/*}" \
            --arg repo "${GITHUB_REPOSITORY#*/}" \
            --arg repo_url "$REPOSITORY_URL" \
            --arg run_url "$RUN_URL" \
            --rawfile notes "${NOTES_FILE:-/dev/null}" '
            ($ENV.GROUP | fromjson) as $group | {
              query: "mutation ($input: ReleaseSyncInputBase!) { releaseSyncByAccessKey(input: $input) { success release { name url } } }",
              variables: {input: ({
                name: "v\($group.version)",
                version: $group.version,
                commitSha: $group.sha,
                pullRequestReferences: $group.prs | map({repositoryOwner: $owner, repositoryName: $repo, number: .}),
                repository: {owner: $owner, name: $repo, provider: "github", url: $repo_url},
                links: ($group.links + [{label: "Workflow run", url: $run_url}])
              } + if $notes == "" then {} else {releaseNotes: {content: $notes}} end)}
            }')

          echo "Pull requests: $(jq -c '.variables.input.pullRequestReferences | map(.number)' <<< "$request")"

          response=$(curl -sS --fail-with-body --retry 3 \
            -H "Authorization: $ACCESS_KEY" \
            -H "Content-Type: application/json" \
            --data @- https://api.linear.app/graphql <<< "$request")

          errors=$(jq -r '.errors[]?.message' <<< "$response")
          if [[ -n "$errors" ]] || ! jq -e '.data.releaseSyncByAccessKey.success' <<< "$response" > /dev/null; then
            while IFS= read -r error; do
              echo "::error::Linear: ${error:-sync did not succeed}"
            done <<< "${errors:-}"
            exit 1
          fi

          url=$(jq -r '.data.releaseSyncByAccessKey.release.url' <<< "$response")
          echo "release-url=$url" >> "$GITHUB_OUTPUT"
          echo "Synced $(jq -r '.data.releaseSyncByAccessKey.release.name' <<< "$response"): $url"

      - name: Write summary
        env:
          NAME: ${{ matrix.group.name }}
          VERSION: ${{ matrix.group.version }}
          PRS: ${{ toJSON(matrix.group.prs) }}
          RELEASE_URL: ${{ steps.sync.outputs.release-url }}
        run: |
          prs=$(jq -r 'map("#\(.)") | join(", ")' <<< "$PRS")
          {
            echo "### Linear release"
            echo ""
            echo "| Entries | Version | Pull requests | Release |"
            echo "| :------ | :------ | :------------ | :------ |"
            echo "| $NAME | \`$VERSION\` | ${prs:-none} | ${RELEASE_URL:-none} |"
          } >> "$GITHUB_STEP_SUMMARY"
