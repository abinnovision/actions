name: Build

concurrency:
  # Group by workflow, branch and PR number.
  # If the event is a merge group, use the merge group id as the PR number.
  # If it's not a PR or merge group, use 'main' as the PR number.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.number || github.event.merge_group.id || 'main' }}
  # Cancel only in-progress jobs when it's a PR.
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' || github.event_name == 'merge_group' }}

on:
  push:
    branches:
      - main
  pull_request_target:
    branches:
      - main

jobs:
  # Configure the commit SHA to use.
  configure:
    name: Configure
    runs-on: ubuntu-22.04
    timeout-minutes: 2
    outputs:
      commit-sha: ${{ env.COMMIT_SHA }}
    steps:
      - name: Evaluate commit
        run: |
          if [[ "${{ github.event_name }}" == "pull_request_target" ]]; then
              echo "PR is #${{ github.event.number }}..."
              echo "PR Head SHA is ${{ github.event.pull_request.head.sha }}..."
              echo "COMMIT_SHA=${{ github.event.pull_request.head.sha }}" >> $GITHUB_ENV
          else
              echo "Head SHA is ${{ github.sha }}..."
              echo "COMMIT_SHA=${{ github.sha }}" >> $GITHUB_ENV
          fi

  # Build and checks are unified into one job. This is because the build
  # needs to be done before the checks, as the checks will use the built
  # packages.
  check_build:
    name: Check & Build
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    needs:
      - configure
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.configure.outputs.commit-sha }}
      - name: Setup Node
        uses: abinnovision/actions@setup-node-dev
      - name: Install dependencies
        run: yarn install --immutable
      - name: Check (lint & format)
        run: yarn check
      - name: Build
        run: yarn build
      - name: Check README
        run: |
          yarn readme:generate
          git diff --exit-code || (echo "README files are not up to date, run 'yarn readme:generate'" && exit 1)
      - name: Check Action References
        run: yarn tsx scripts/check-action-refs.ts
      - name: Check Dependencies
        run: |
          yarn dedupe --check || (echo "yarn.lock is not up to date, run 'yarn dedupe'" && exit 1)
          yarn turbo boundaries || (echo "turbo boundaries failed" && exit 1)

  # Will check if the release is needed and create a release PR if so.
  release:
    name: Release
    needs:
      - configure
      - check_build
    uses: abinnovision/workflows/.github/workflows/release-v2.yaml@main
    secrets: inherit
    # Only run on push to "main" branch.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs:
      - configure
      - release
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: "write"
      id-token: "write"
    steps:
      - id: gh-app-token
        name: "Generate GitHub App Token"
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_RELASER_CUSTOM_ID }}
          private-key: ${{ secrets.APP_RELASER_CUSTOM_PK }}
          permission-contents: "write"
          permission-issues: "write"
          permission-pull-requests: "write"
          permission-workflows: "write"
          permission-actions: "write"
      - id: gh-app-details
        name: "Get GitHub App Details"
        env:
          GH_TOKEN: ${{ steps.gh-app-token.outputs.token }}
        shell: bash
        run: |
          # Fetch the id of the bot user.
          response=$(gh api "/users/${{ steps.gh-app-token.outputs.app-slug }}[bot]") >> "$GITHUB_OUTPUT"

          # Extract the id of the bot user.
          user_id=$(echo "$response" | jq -cr ".id")

          echo "committer-email=${{ steps.gh-app-token.outputs.app-slug }}[bot] <$user_id+${{ steps.gh-app-token.outputs.app-slug }}[bot]@users.noreply.github.com>" >> "$GITHUB_OUTPUT"
          echo "committer-name=${{ steps.gh-app-token.outputs.app-slug }}[bot]" >> "$GITHUB_OUTPUT"
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.configure.outputs.commit-sha }}
          token: ${{ steps.gh-app-token.outputs.token }}
      - name: Setup Node
        uses: abinnovision/actions@setup-node-dev
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build
        run: yarn run build
      - name: Publish
        shell: bash
        run: |
          set -euo pipefail

          git config --global user.name "${{ steps.gh-app-details.outputs.committer-name }}"
          git config --global user.email "${{ steps.gh-app-details.outputs.committer-email }}"

          WORKSPACE="${{ github.workspace }}"
          PACK_DIR="/opt/temporary/packs"
          SCRATCH="/opt/temporary/publish"

          # Shared object database for the whole run. Every item becomes an orphan
          # commit in here and all refs go out in a single push at the end.
          git init -q -b main "$SCRATCH"
          git --git-dir="$SCRATCH/.git" remote add origin https://x-access-token:${{ steps.gh-app-token.outputs.token }}@github.com/$GITHUB_REPOSITORY

          # Runs git against the shared object database.
          pgit() {
            git --git-dir="$SCRATCH/.git" "$@"
          }

          # Refspecs collected by stage_item, pushed together at the end.
          push_refs=()

          # Pack every publishable workspace once, up front.
          mkdir -p "$PACK_DIR"
          yarn workspaces foreach -A -p \
            --include 'actions/*' --include 'workflows/*' \
            pack --out "$PACK_DIR/%s.tgz"

          # Unified function to stage both actions and workflows
          stage_item() {
            local path=$1
            local mode=$2  # "dev" or "release"

            echo "Staging '$path' ($mode mode)..."

            # Detect type and set type-specific variables
            local item_type
            local item_name
            local commit_prefix
            local staging_dir

            # Define item type, name, and other variables based on path
            if [[ "$path" == *"actions/"* ]]; then
              item_type="action"
              item_name=$(jq -r '.name' "$path/package.json")
              commit_prefix=""
            else
              item_type="workflow"
              item_name=$(jq -r '.name' "$path/package.json")
              commit_prefix="workflow "
            fi

            # Validate item name
            if [[ -z "$item_name" || "$item_name" == "null" ]]; then
              echo "Error: Invalid or missing 'name' in $path/package.json"
              exit 1
            fi

            staging_dir="/opt/temporary/$item_type-$item_name-$mode"

            local item_version=$(jq -r '.version' "$path/package.json")

            # Validate item version
            if [[ -z "$item_version" || "$item_version" == "null" ]]; then
              echo "Error: Invalid or missing 'version' in $path/package.json"
              exit 1
            fi

            # Unpack the pre-packed archive into a staging environment
            rm -rf "$staging_dir"
            mkdir -p "$staging_dir"
            tar -C "$staging_dir" --strip-components=1 -xzf "$PACK_DIR/$item_name.tgz"

            # Workflow-specific: restructure files and move the workflow file
            if [[ "$item_type" == "workflow" ]]; then
              mkdir -p "$staging_dir/.github/workflows"
              mv "$staging_dir/workflow.yaml" "$staging_dir/.github/workflows/workflow.yaml"
            fi

            # Resolve internal action references (replace -dev with exact versions)
            if [[ "$mode" == "release" ]]; then
              echo "Resolving internal action references..."
              yarn tsx scripts/resolve-action-refs.ts --staging-dir "$staging_dir" --workspace-root "$WORKSPACE"
            fi

            # Determine branch name and version based on mode
            local branch_name
            local version_tag

            if [[ "$mode" == "dev" ]]; then
              branch_name="$item_type/$item_name/dev"
              version_tag="dev"
            else
              branch_name="$item_type/$item_name/v$item_version"
              version_tag="$item_version"
            fi

            # Collect tags based on mode
            # Tag format is consistent for both actions and workflows: name-v{version}
            local tags_to_push=()

            if [[ "$mode" == "dev" ]]; then
              # Dev tags: name-dev
              tags_to_push+=("${item_name}-dev")
            else
              # Release tags: name-v{version} (patch, minor, major)
              tags_to_push+=("${item_name}-v${item_version}")
              tags_to_push+=("${item_name}-v$(echo $item_version | cut -d. -f1-2)")
              tags_to_push+=("${item_name}-v$(echo $item_version | cut -d. -f1)")
            fi

            # Write the staged content as an orphan commit into the shared object
            # database, using a dedicated index so items never collide.
            local index="$SCRATCH/.git/index-$mode-$item_name"
            local tree
            local commit

            rm -f "$index"
            GIT_INDEX_FILE="$index" pgit --work-tree="$staging_dir" add -A
            tree=$(GIT_INDEX_FILE="$index" pgit write-tree)
            commit=$(pgit commit-tree "$tree" -m "chore: release ${commit_prefix}${item_name}@${version_tag}")
            rm -f "$index"

            pgit update-ref "refs/heads/$branch_name" "$commit"
            push_refs+=("+refs/heads/$branch_name:refs/heads/$branch_name")

            for tag in "${tags_to_push[@]}"; do
              pgit update-ref "refs/tags/$tag" "$commit"
              push_refs+=("+refs/tags/$tag:refs/tags/$tag")
            done

            # Cleanup: the objects live in the shared database now
            rm -rf "$staging_dir"
          }

          # Phase 1: Stage releases (if any were created)
          if [[ "${{ needs.release.outputs.releases-created }}" == "true" ]]; then
            echo "==> Staging versioned releases..."
            while read -r path; do
              [[ -n "$path" ]] || continue

              if [[ "$path" == "packages/"* ]]; then
                echo "Skipping non-publishable path: $path"
                continue
              fi
              stage_item "$path" "release"
            done <<< "$(echo '${{ needs.release.outputs.paths-released }}' | jq -cr '.[]')"
          else
            echo "==> No releases created, skipping versioned publishing"
          fi

          # Phase 2: Always stage dev builds
          echo "==> Staging dev builds..."

          # Get the list of all workspaces
          workspace_output=$(yarn workspaces list --json)

          all_locations=()
          while read -r raw; do
            location=$(echo "$raw" | jq -r '.location')

            # Include both actions and workflows
            if [[ "$location" == *"actions/"* ]] || [[ "$location" == *"workflows/"* ]]; then
              all_locations+=("$location")
            fi
          done <<< "$workspace_output"

          # Stage all items as dev builds
          for path in "${all_locations[@]}"; do
            stage_item "$path" "dev"
          done

          # Publish everything in a single push
          echo "==> Publishing ${#push_refs[@]} refs..."
          pgit push --atomic --force origin "${push_refs[@]}"
