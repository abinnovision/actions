name: Update Tags

on:
  workflow_call:
    inputs:
      token-broker-url:
        type: string
        required: false
        default: ""
        description: |-
          URL of the token broker for OIDC token exchange.
          **Default:** Falls back to `vars.TOKEN_BROKER_URL` if not provided.
      application:
        type: string
        required: true
        description: |-
          Application directory name to update.
          **Required:** Always
          **Example:** `staging`, `production`, `my-app`

      updates:
        type: string
        required: true
        description: |-
          Image tag updates to apply, in CSV format (one entry per image).
          Format: image-name:tag,image-name:tag,...
          Example: app-backend:v1.4.2,app-frontend:v1.4.2

      applications-directory:
        type: string
        required: false
        default: "k8s/applications"
        description: |-
          Root directory containing application subdirectories.
          **Default:** `k8s/applications`

      default-branch:
        type: string
        required: false
        default: "main"
        description: |-
          Default branch name for the repository.
          **Default:** `main`

      automerge-images:
        type: string
        required: false
        default: ""
        description: |-
          Comma-separated list of image names that must ALL be updated to enable automerge.
          Leave empty to disable automerge for this application.

          **Scoping to applications:** Control automerge per-application by passing this
          input only for applications that should automerge (e.g., staging) and omitting
          it for applications that require manual review (e.g., production).

          **Example:** `backend,tma,portal`

env:
  BRANCH_MAIN: ${{ inputs.default-branch }}
  BRANCH_TARGET: fix/tag-update/${{ inputs.application }}

concurrency:
  cancel-in-progress: false
  group: ${{ github.workflow }}--${{ inputs.application }}

jobs:
  update-tags:
    name: Update Image Tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - id: token
        name: Generate GitHub App token
        uses: abinnovision/actions@exchange-github-token-v1.3.0
        with:
          broker-url: ${{ inputs.token-broker-url || vars.TOKEN_BROKER_URL }}
          scope: contents:write pull_requests:write

      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ steps.token.outputs.token }}

      - name: Setup Git config
        run: |
          git config --global user.name '${{ steps.token.outputs.committer-name }}'
          git config --global user.email '${{ steps.token.outputs.committer-email }}'

      - name: Parse updates
        run: |
          set -e

          PARSED_UPDATES=""

          IFS=',' read -ra PAIRS <<< "${{ inputs.updates }}"
          for pair in "${PAIRS[@]}"; do
            # Trim whitespace
            pair=$(echo "$pair" | xargs)

            if [[ -z "$pair" ]]; then
              continue
            fi

            if [[ "$pair" != *:* ]]; then
              echo "::error::Invalid update entry '$pair'. Expected format: image-name:tag"
              exit 1
            fi

            PARSED_UPDATES="${PARSED_UPDATES}${pair}"$'\n'
          done

          if [[ -z "$PARSED_UPDATES" ]]; then
            echo "::error::No image tag updates found in the 'updates' input"
            exit 1
          fi

          echo "::group::Parsed updates"
          echo "$PARSED_UPDATES"
          echo "::endgroup::"

          # Store parsed updates (one image:tag per line) for later steps
          echo "PARSED_UPDATES<<EOF" >> "$GITHUB_ENV"
          echo "$PARSED_UPDATES" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: abinnovision/actions@setup-node-v1.2.1

      - name: Setup k8s tools
        uses: abinnovision/actions@setup-k8s-tools-v2.0.3
        with:
          kustomize: latest

      - name: Validate application
        run: |
          app_dir="${{ inputs.applications-directory }}/${{ inputs.application }}"

          if [[ ! -d "$app_dir" ]]; then
            echo "::error::Application directory not found: $app_dir"
            echo "::error::Available applications:"
            ls -1 "${{ inputs.applications-directory }}" || echo "  (none)"
            exit 1
          fi

          if [[ ! -f "$app_dir/kustomization.yaml" ]]; then
            echo "::error::kustomization.yaml not found in $app_dir"
            exit 1
          fi

          echo "Application directory validated: $app_dir"

          MISSING_IMAGES=""

          while IFS=':' read -r image tag; do
            [[ -z "$image" ]] && continue

            if yq eval ".images[] | select(.name == \"$image\")" "$app_dir/kustomization.yaml" | grep -q .; then
              echo "Image name validated: $image"
            else
              echo "::error::Image '$image' not found in kustomization.yaml"
              MISSING_IMAGES="${MISSING_IMAGES}${image}, "
            fi
          done <<< "$PARSED_UPDATES"

          if [[ -n "$MISSING_IMAGES" ]]; then
            echo "::error::Images not found in kustomization.yaml: ${MISSING_IMAGES%, }"
            echo "::error::Available images:"
            yq eval '.images[].name' "$app_dir/kustomization.yaml" || echo "  (none)"
            exit 1
          fi

      - name: Set image tag
        working-directory: ${{ inputs.applications-directory }}/${{ inputs.application }}
        run: |
          while IFS=':' read -r image tag; do
            [[ -z "$image" ]] && continue

            echo "Setting image tag: $image -> $tag"
            kustomize edit set image "${image}=*:${tag}"
          done <<< "$PARSED_UPDATES"

          echo "::group::Changes to kustomization.yaml"
          git diff kustomization.yaml || true
          echo "::endgroup::"

      - name: Format files
        run: |
          yarn install --immutable
          yarn format:fix

      - name: Build commit message
        run: |
          COMMIT_BODY=""

          while IFS=':' read -r image tag; do
            [[ -z "$image" ]] && continue
            COMMIT_BODY="${COMMIT_BODY}- ${image} -> ${tag}"$'\n'
          done <<< "$PARSED_UPDATES"

          echo "COMMIT_MESSAGE<<EOF" >> "$GITHUB_ENV"
          echo "fix(${{ inputs.application }}): update image tags" >> "$GITHUB_ENV"
          echo "" >> "$GITHUB_ENV"
          printf '%s' "$COMMIT_BODY" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

      - name: Build PR description
        run: |
          CHANGES_LIST=""

          while IFS=':' read -r image tag; do
            if [[ -z "$image" ]]; then
              continue
            fi
            CHANGES_LIST="${CHANGES_LIST}- \`${image}\` -> \`${tag}\`"$'\n'
          done <<< "$PARSED_UPDATES"

          echo "PR_CHANGES<<EOF" >> "$GITHUB_ENV"
          echo "$CHANGES_LIST" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

          echo "::group::PR Changes"
          echo "$CHANGES_LIST"
          echo "::endgroup::"

      - name: Check automerge conditions
        run: |
          # Skip if automerge-images is not configured
          if [[ -z "${{ inputs.automerge-images }}" ]]; then
            echo "Automerge not configured (automerge-images is empty)"
            echo "AUTOMERGE_ENABLED=false" >> "$GITHUB_ENV"
            exit 0
          fi

          # Extract updated image names from PARSED_UPDATES (format: image:tag)
          UPDATED_IMAGES=$(echo "$PARSED_UPDATES" | cut -d: -f1 | sort -u | grep -v '^$')

          echo "::group::Automerge check"
          echo "Required images: ${{ inputs.automerge-images }}"
          echo "Updated images:"
          echo "$UPDATED_IMAGES"

          # Check if all required images are present
          IFS=',' read -ra REQUIRED <<< "${{ inputs.automerge-images }}"
          ALL_PRESENT=true
          MISSING=""
          for img in "${REQUIRED[@]}"; do
            # Trim whitespace
            img=$(echo "$img" | xargs)
            if ! echo "$UPDATED_IMAGES" | grep -qx "$img"; then
              echo "Missing required image: $img"
              ALL_PRESENT=false
              MISSING="${MISSING}${img}, "
            else
              echo "Found required image: $img"
            fi
          done

          # Trim trailing ", " for reporting
          MISSING="${MISSING%, }"

          echo "All required images present: $ALL_PRESENT"
          echo "::endgroup::"

          echo "AUTOMERGE_ENABLED=$ALL_PRESENT" >> "$GITHUB_ENV"
          echo "AUTOMERGE_MISSING=$MISSING" >> "$GITHUB_ENV"

      - name: Create Pull Request
        id: create-pull-request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.token.outputs.token }}
          commit-message: ${{ env.COMMIT_MESSAGE }}
          branch: ${{ env.BRANCH_TARGET }}
          base: ${{ env.BRANCH_MAIN }}
          delete-branch: true
          title: "fix(${{ inputs.application }}): update image tags"
          body: |
            ## 🔄 Image Tag Updates

            **Application:** `${{ inputs.application }}`

            This PR was automatically created to update image tags for the specified application.

            ### Changes
            ${{ env.PR_CHANGES }}

            ---
            <sub>🤖 This PR was automatically generated by the _update-tags.yaml_ workflow</sub>
          labels: |
            automated
            gitops

      - name: Enable automerge
        if: env.AUTOMERGE_ENABLED == 'true' && steps.create-pull-request.outputs.pull-request-number != ''
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ steps.token.outputs.token }}
          pull-request-number: ${{ steps.create-pull-request.outputs.pull-request-number }}
          merge-method: squash

      - name: Write job summary
        if: steps.create-pull-request.outputs.pull-request-number != ''
        run: |
          {
            echo "## 🔄 Image Tag Update — \`${{ inputs.application }}\`"
            echo ""
            echo "Tag updates included in the pull request:"
            echo ""
            echo "| Image | New Tag |"
            echo "| :---- | :------ |"
            while IFS=':' read -r image tag; do
              [[ -z "$image" ]] && continue
              echo "| \`${image}\` | \`${tag}\` |"
            done <<< "$PARSED_UPDATES"
            echo ""
            echo "**Pull Request:** [#${{ steps.create-pull-request.outputs.pull-request-number }}](${{ steps.create-pull-request.outputs.pull-request-url }})"
            echo ""
            if [[ "$AUTOMERGE_ENABLED" == "true" ]]; then
              echo "**Automerge:** ✅ enabled — all required images updated"
            elif [[ -n "${{ inputs.automerge-images }}" ]]; then
              echo "**Automerge:** ⏳ pending — waiting for: ${AUTOMERGE_MISSING:-unknown}"
            else
              echo "**Automerge:** not configured"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # Headline annotation, surfaced in the run list and the PR checks tab
          SUMMARY=$(echo "$PARSED_UPDATES" | grep -v '^$' | paste -sd ',' -)
          echo "::notice title=Tag Update::${{ inputs.application }}: ${SUMMARY} (PR #${{ steps.create-pull-request.outputs.pull-request-number }})"
