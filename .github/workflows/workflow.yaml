name: IaC Stack

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        required: false
        default: "tofu"
        description: |-
          Root module directories, one pattern per line.
          `*` matches exactly one path segment and skips dot directories. Only directories with a `*.tf` or `*.tofu` file count.
          Every pattern must match a root.
          **Default:** `tofu`
          **Example:** `infra`, `tofu/*`

      enable-tests:
        type: boolean
        required: false
        default: false
        description: |-
          Run `tofu test` for every root in the Check job, without credentials.
          Providers must be mocked, since `command = plan` still configures them.
          **Default:** `false`

      gcp-workload-identity-provider:
        type: string
        required: false
        default: ""
        description: |-
          Full Workload Identity Federation provider resource name.
          Authenticates directly as the repository without a service account.
          This is public configuration, not a secret.
          **Default:** Falls back to `vars.FOUNDRY_WIF_PROVIDER` if not provided.

      state-bucket:
        type: string
        required: false
        default: ""
        description: |-
          GCS bucket holding the state.
          **Default:** Falls back to `vars.FOUNDRY_STATE_BUCKET` if not provided.

      state-key:
        type: string
        required: false
        default: ""
        description: |-
          Full KMS crypto key resource name used to encrypt the state and plan files.
          **Default:** Falls back to `vars.FOUNDRY_STATE_KEY` if not provided.

      state-prefix:
        type: string
        required: false
        default: ""
        description: |-
          Prefix of the GCS state object, so several roots can share one bucket.
          `{path}` expands to the root directory and `{name}` to its last segment, the repository name for the root `.`. Expanded prefixes must be unique.
          A prefix without placeholders is only allowed when `working-directory` matches exactly one root.
          **Default:** Falls back to the root directory if not provided.
          **Example:** `{name}`, `infra/{path}`

      default-branch:
        type: string
        required: false
        default: "main"
        description: |-
          Branch that triggers the apply job on push.
          **Default:** `main`

      apply-environment:
        type: string
        required: false
        default: "production"
        description: |-
          GitHub environment used by the apply job. Set to an empty string to disable.
          **Default:** `production`

      token-broker-url:
        type: string
        required: false
        default: ""
        description: |-
          URL of the token broker for OIDC token exchange.
          **Default:** Falls back to `vars.TOKEN_BROKER_URL` if not provided.

      github-token-plan-scope:
        type: string
        required: false
        default: ""
        description: |-
          Token broker scopes for the GitHub token used by plan, whitespace-separated.
          The token is exported as `GITHUB_TOKEN` for the OpenTofu GitHub provider.
          **Default:** Empty, the token exchange is skipped.
          **Example:** `contents:read administration:read`

      github-token-apply-scope:
        type: string
        required: false
        default: ""
        description: |-
          Token broker scopes for the GitHub token used by apply, whitespace-separated.
          The token is exported as `GITHUB_TOKEN` for the OpenTofu GitHub provider.
          **Default:** Empty, the token exchange is skipped.
          **Example:** `contents:write administration:write`

      github-token-resources:
        type: string
        required: false
        default: ""
        description: |-
          Resources the exchanged GitHub token can access, using typed prefixes
          (`repo:owner/name`, `org:name`, `enterprise:slug`), whitespace-separated.
          **Default:** Empty, the token is scoped to the current repository.

      github-token-roots:
        type: string
        required: false
        default: ""
        description: |-
          Roots that receive the exchanged GitHub token, one pattern per line, with the same
          semantics as `working-directory`. Every pattern must match a root.
          **Default:** Empty, every root receives the token.
          **Example:** `tofu/github`

permissions: {}

env:
  WIF_PROVIDER: ${{ inputs.gcp-workload-identity-provider || vars.FOUNDRY_WIF_PROVIDER }}
  STATE_BUCKET: ${{ inputs.state-bucket || vars.FOUNDRY_STATE_BUCKET }}
  STATE_KEY: ${{ inputs.state-key || vars.FOUNDRY_STATE_KEY }}

defaults:
  run:
    shell: bash

jobs:
  # Resolve the mode and trust for this event and validate the configuration.
  configure:
    name: Configure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      # Commit under test: PR head, merge group head or the pushed commit.
      commit-sha: ${{ steps.event.outputs.commit-sha }}

      # Operation against the backend: pr, main or none.
      mode: ${{ steps.event.outputs.mode }}

      # Whether credentialed jobs may run: false for fork and Dependabot pull requests.
      trusted: ${{ steps.event.outputs.trusted }}

      # Token broker scopes for the GitHub provider token of this mode.
      github-token-scope: ${{ steps.evaluate.outputs.github_token_scope }}

      # Root module directories as a compact JSON array.
      roots: ${{ steps.roots.outputs.paths }}

      # Roots that receive the GitHub provider token, as a compact JSON array.
      github-token-roots: ${{ steps.token-roots.outputs.paths || steps.roots.outputs.paths }}

      # State prefix per root as a compact JSON object.
      state-prefixes: ${{ steps.roots.outputs.values }}
    steps:
      # Resolve the commit SHA, mode and trust for this event. Pull requests from forks and Dependabot cannot use
      # credentials.
      - name: Evaluate event
        id: event
        uses: abinnovision/actions@evaluate-event-v1.1.0
        with:
          default-branch: ${{ inputs.default-branch }}

      # Check out the root files of the resolved commit only; root discovery reads the git tree.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.event.outputs.commit-sha }}
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/

      # Every directory matching a pattern line that contains a `*.tf` or `*.tofu` file is a root. Renders the state
      # prefix of each root, which must be unique.
      - name: Resolve roots
        id: roots
        uses: abinnovision/actions@match-paths-v1.1.0
        with:
          marker: |
            *.tf
            *.tofu
          patterns: ${{ inputs.working-directory }}
          require-match: true
          template: ${{ inputs.state-prefix || '{path}' }}
          unique: value

      # Roots that receive the GitHub provider token. Without github-token-roots, every root receives it.
      - name: Resolve GitHub token roots
        id: token-roots
        if: inputs.github-token-roots != ''
        uses: abinnovision/actions@match-paths-v1.1.0
        with:
          items: ${{ steps.roots.outputs.items }}
          patterns: ${{ inputs.github-token-roots }}
          require-match: true

      - name: Evaluate
        id: evaluate
        env:
          MODE: ${{ steps.event.outputs.mode }}
          TRUSTED: ${{ steps.event.outputs.trusted }}
          ROOTS: ${{ steps.roots.outputs.paths }}
          INPUT_GITHUB_TOKEN_ROOTS: ${{ inputs.github-token-roots }}
          PLAN_SCOPE: ${{ inputs.github-token-plan-scope }}
          APPLY_SCOPE: ${{ inputs.github-token-apply-scope }}
          BROKER_URL: ${{ inputs.token-broker-url || vars.TOKEN_BROKER_URL }}
        run: |
          github_token_scope=""

          if [[ "$MODE" == "pr" && "$TRUSTED" == "true" ]]; then
            github_token_scope="$PLAN_SCOPE"
          elif [[ "$MODE" == "main" ]]; then
            github_token_scope="$APPLY_SCOPE"
          fi

          if [[ -n "$INPUT_GITHUB_TOKEN_ROOTS" && -z "$PLAN_SCOPE" && -z "$APPLY_SCOPE" ]]; then
            echo "::error::github-token-roots requires github-token-plan-scope or github-token-apply-scope"
            exit 1
          fi

          if [[ "$ROOTS" == "[]" ]]; then
            echo "::error::No root module matches working-directory"
            exit 1
          fi

          if [[ "$MODE" == "main" || ( "$MODE" == "pr" && "$TRUSTED" == "true" ) ]]; then
            if [[ -z "$WIF_PROVIDER" || -z "$STATE_BUCKET" || -z "$STATE_KEY" ]]; then
              echo "::error::A workload identity provider, state bucket and state key are required. Enable the foundry-state-backend custom property or set the inputs."
              exit 1
            fi

            if [[ -n "$github_token_scope" && -z "$BROKER_URL" ]]; then
              echo "::error::token-broker-url is required when a GitHub token scope is provided"
              exit 1
            fi
          fi

          # Scopes may be newline-separated; outputs must be single-line.
          echo "github_token_scope=$(echo "$github_token_scope" | xargs)" >> "$GITHUB_OUTPUT"

  # Repo checks and static OpenTofu checks without backend or credentials.
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - configure
    permissions:
      contents: read
      # Private GitHub Package Registry dependencies during install.
      packages: read
    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.configure.outputs.commit-sha }}
          persist-credentials: false

      - name: Setup Tools
        uses: abinnovision/actions@setup-tools-v2.0.0
      - name: Install dependencies
        run: yarn install --immutable
      - name: Check dependencies
        run: yarn dedupe --check || (echo "yarn.lock is not up to date, run 'yarn dedupe'" && exit 1)
      - name: Check
        run: yarn run check

      - name: Check formatting
        env:
          ROOTS: ${{ needs.configure.outputs.roots }}
        run: |
          while IFS= read -r root; do
            tofu -chdir="$root" fmt -check -recursive
          done < <(jq -r '.[]' <<< "$ROOTS")

      - name: Initialize OpenTofu (without backend)
        env:
          ROOTS: ${{ needs.configure.outputs.roots }}
        run: |
          while IFS= read -r root; do
            tofu -chdir="$root" init -backend=false -input=false
          done < <(jq -r '.[]' <<< "$ROOTS")

      - name: Validate
        env:
          ROOTS: ${{ needs.configure.outputs.roots }}
        run: |
          while IFS= read -r root; do
            tofu -chdir="$root" validate
          done < <(jq -r '.[]' <<< "$ROOTS")

      # Roots without test files are skipped.
      - name: Test
        if: inputs.enable-tests
        env:
          ROOTS: ${{ needs.configure.outputs.roots }}
        run: |
          shopt -s nullglob
          while IFS= read -r root; do
            files=("$root"/*.tftest.hcl "$root"/*.tofutest.hcl "$root"/tests/*.tftest.hcl "$root"/tests/*.tofutest.hcl)
            if [[ ${#files[@]} -eq 0 ]]; then
              echo "::notice::No tests found in $root, skipping"
              continue
            fi
            tofu -chdir="$root" test -no-color
          done < <(jq -r '.[]' <<< "$ROOTS")

  # Plan each root against the real state and report it on the pull request.
  plan:
    name: "Plan: ${{ matrix.root }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - configure
      - check
    if: needs.configure.outputs.mode == 'pr' && needs.configure.outputs.trusted == 'true'
    strategy:
      fail-fast: false
      matrix:
        root: ${{ fromJSON(needs.configure.outputs.roots) }}
    env:
      WORKING_DIR: ${{ matrix.root }}
      STATE_PREFIX: ${{ fromJSON(needs.configure.outputs.state-prefixes)[matrix.root] }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - *checkout

      - &setup-tools
        name: Setup Tools
        uses: abinnovision/actions@setup-tools-v2.0.0

      - &configure-state-encryption
        name: Configure state encryption
        run: |
          {
            echo "TF_ENCRYPTION<<TF_ENCRYPTION_EOF"
            cat <<EOF
          key_provider "gcp_kms" "foundry" {
            kms_encryption_key = "$STATE_KEY"
            key_length         = 32
          }
          method "aes_gcm" "foundry" {
            keys = key_provider.gcp_kms.foundry
          }
          method "unencrypted" "migrate" {}
          state {
            method = method.aes_gcm.foundry
            fallback {
              method = method.unencrypted.migrate
            }
          }
          plan {
            method = method.aes_gcm.foundry
          }
          EOF
            echo "TF_ENCRYPTION_EOF"
          } >> "$GITHUB_ENV"

      - &setup-gcp
        name: Setup GCP Authentication
        uses: abinnovision/actions@setup-gcp-v1.2.0
        with:
          workload-identity-provider: ${{ env.WIF_PROVIDER }}

      - &github-token
        id: github-token
        name: Exchange token for GitHub provider
        if: >-
          needs.configure.outputs.github-token-scope != ''
          && contains(fromJSON(needs.configure.outputs.github-token-roots), matrix.root)
        uses: abinnovision/actions@exchange-github-token-v1.4.1
        with:
          broker-url: ${{ inputs.token-broker-url || vars.TOKEN_BROKER_URL }}
          scope: ${{ needs.configure.outputs.github-token-scope }}
          resources: ${{ inputs.github-token-resources }}

      - &init
        name: Initialize OpenTofu
        run: |
          tofu -chdir="$WORKING_DIR" init -input=false \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="prefix=$STATE_PREFIX"

      # Plans on pull requests never write state, so they skip the lock.
      - name: Plan
        id: plan
        env:
          GITHUB_TOKEN: ${{ steps.github-token.outputs.token }}
        run: tofu -chdir="$WORKING_DIR" plan -lock=false -no-color -input=false -out=tfplan

      # Rendering can reject valid plans; the failure comment below covers it.
      - name: Comment plan on pull request
        id: comment
        if: ${{ steps.plan.outcome == 'success' }}
        continue-on-error: true
        uses: borchero/terraform-plan-comment@v3
        with:
          token: ${{ github.token }}
          terraform-cmd: tofu
          working-directory: ${{ matrix.root }}
          planfile: tfplan
          header: "OpenTofu plan: `${{ matrix.root }}`"

      # Replaces the sticky plan comment so a stale plan is never shown as current.
      - name: Comment plan failure on pull request
        if: ${{ !cancelled() && (steps.plan.outcome == 'failure' || steps.comment.outcome == 'failure') }}
        env:
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          HEADER="## OpenTofu plan: \`$WORKING_DIR\`"
          export HEADER

          if [[ "$PLAN_OUTCOME" == "failure" ]]; then
            MESSAGE="**Plan failed**"
          else
            echo "::warning::The plan succeeded but could not be rendered as a comment"
            MESSAGE="**Plan could not be rendered**"
          fi

          {
            echo "$HEADER"
            echo
            echo "$MESSAGE at \`${HEAD_SHA:0:7}\`, see the [workflow run]($RUN_URL)."
          } > body.md

          cat body.md >> "$GITHUB_STEP_SUMMARY"

          mapfile -t COMMENT_IDS < <(gh api --paginate "repos/$GH_REPO/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith(env.HEADER))) | .id')

          if [[ ${#COMMENT_IDS[@]} -eq 0 ]]; then
            gh api --method POST "repos/$GH_REPO/issues/$PR_NUMBER/comments" -F body=@body.md > /dev/null
            exit 0
          fi

          gh api --method PATCH "repos/$GH_REPO/issues/comments/${COMMENT_IDS[0]}" -F body=@body.md > /dev/null
          # Large plans span several comments; drop the remaining parts.
          for id in "${COMMENT_IDS[@]:1}"; do
            gh api --method DELETE "repos/$GH_REPO/issues/comments/$id" > /dev/null
          done

  # Apply a fresh plan per root on the default branch.
  apply:
    name: "Apply: ${{ matrix.root }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - configure
      - check
    if: needs.configure.outputs.mode == 'main'
    environment: ${{ inputs.apply-environment || null }}
    strategy:
      fail-fast: false
      matrix:
        root: ${{ fromJSON(needs.configure.outputs.roots) }}
    env:
      WORKING_DIR: ${{ matrix.root }}
      STATE_PREFIX: ${{ fromJSON(needs.configure.outputs.state-prefixes)[matrix.root] }}
    permissions:
      contents: read
      id-token: write
    steps:
      - *checkout
      - *setup-tools
      - *configure-state-encryption
      - *setup-gcp
      - *github-token
      - *init

      - name: Plan
        env:
          GITHUB_TOKEN: ${{ steps.github-token.outputs.token }}
        run: tofu -chdir="$WORKING_DIR" plan -input=false -out=tfplan

      - name: Apply
        env:
          GITHUB_TOKEN: ${{ steps.github-token.outputs.token }}
        run: tofu -chdir="$WORKING_DIR" apply -input=false tfplan

  # Single required status check for rulesets.
  status:
    name: Status
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [configure, check, plan, apply]
    if: always()
    permissions: {}
    steps:
      - name: Evaluate status
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
