name: Run Repo Checks
author: "abi group GmbH"
description: |
  Runs the repository baseline checks: sets up the tools from .tool-versions,
  installs dependencies, verifies the lockfile is deduplicated and runs the check command.
  The repository must already be checked out.

inputs:
  install-command:
    description: "Command to install dependencies"
    required: false
    default: "yarn install --immutable"
  check-command:
    description: "Command to run the repository checks"
    required: false
    default: "yarn check"

runs:
  using: composite
  steps:
    - name: Setup Tools
      uses: abinnovision/actions@setup-tools-dev

    - name: Install dependencies
      shell: bash
      env:
        INSTALL_COMMAND: ${{ inputs.install-command }}
      run: eval "$INSTALL_COMMAND"

    - name: Check dependencies
      shell: bash
      run: |
        if ! yarn dedupe --check; then
          echo "::error::yarn.lock is not up to date, run 'yarn dedupe'"
          exit 1
        fi

    - name: Check
      shell: bash
      env:
        CHECK_COMMAND: ${{ inputs.check-command }}
      run: eval "$CHECK_COMMAND"
