name: Setup Tools
author: "abi group GmbH"
description: |
  Setup development tools from the mise config (mise.toml, .tool-versions and the other files mise reads).
  Installs every tool the config declares.
  Adds extras for Node.js (corepack when packageManager is set, yarn and Turbo caches,
  GitHub Packages scope), Go (local toolchain only, module and build caches) and uv (cache).
  Python implies uv.

inputs:
  tool-versions-file:
    description: "Path to .tool-versions; its directory is where mise looks for config. The file itself is optional."
    required: false
    default: ".tool-versions"
  node-token:
    description: "Token for the GitHub Packages registry (used when Node.js is installed)"
    required: false
    default: ${{ github.token }}

outputs:
  versions:
    description: "JSON object keyed by mise tool name; each value is a list of {version, requested_version, install_path, source}. Lists declared tools only."
    value: ${{ steps.mise.outputs.versions }}

runs:
  using: composite
  steps:
    - id: prepare
      name: "Prepare"
      shell: bash
      env:
        TOOL_VERSIONS_FILE: ${{ inputs.tool-versions-file }}
      run: |
        dir="$(dirname "$TOOL_VERSIONS_FILE")"
        if [ ! -d "$dir" ]; then
          echo "::error::Directory '$dir' not found"
          exit 1
        fi
        {
          echo "working-directory=$dir"
          echo "filename=$(basename "$TOOL_VERSIONS_FILE")"
        } >> "$GITHUB_OUTPUT"

    - id: mise
      name: "Install tools with mise"
      uses: jdx/mise-action@v5
      env:
        MISE_OVERRIDE_TOOL_VERSIONS_FILENAMES: ${{ steps.prepare.outputs.filename }}
      with:
        # Bump manually; the version is part of the cache key.
        version: 2026.10.9
        working_directory: ${{ steps.prepare.outputs.working-directory }}
        add_shims_to_path: "false"
        # Save in the post step so tools installed by later steps are cached too.
        cache_save_post: "true"

    - name: "Verify installed tools"
      shell: bash
      env:
        VERSIONS: ${{ steps.mise.outputs.versions }}
        WORKING_DIRECTORY: ${{ steps.prepare.outputs.working-directory }}
      run: |
        if [ -z "$VERSIONS" ] || [ "$VERSIONS" = "{}" ]; then
          echo "::error::mise found no tools in $WORKING_DIRECTORY; add a mise.toml or .tool-versions"
          exit 1
        fi

    # Python implies uv when the config does not pin it. uv is not in a project lock file, so this step runs unlocked.
    - id: uv
      name: "Install uv for Python"
      if: steps.mise.outputs.python != '' && steps.mise.outputs.uv == ''
      shell: bash
      working-directory: ${{ steps.prepare.outputs.working-directory }}
      env:
        MISE_LOCKED: "0"
        MISE_GLOBAL_CONFIG_FILE: ${{ runner.temp }}/setup-tools/mise.toml
        MISE_GITHUB_TOKEN: ${{ github.token }}
      run: |
        mkdir -p "$(dirname "$MISE_GLOBAL_CONFIG_FILE")"
        printf '[tools]\nuv = "latest"\n' > "$MISE_GLOBAL_CONFIG_FILE"
        mise install uv
        mise bin-paths uv >> "$GITHUB_PATH"
        echo "version=$(mise current uv)" >> "$GITHUB_OUTPUT"

    # Node.js
    - id: node
      name: "Setup Node.js extras"
      if: steps.mise.outputs.node != ''
      shell: bash
      env:
        NODE_TOKEN: ${{ inputs.node-token }}
      run: |
        if [ -f package.json ] && jq -e '.packageManager' package.json > /dev/null; then
          # Node.js 25+ no longer bundles corepack.
          command -v corepack > /dev/null || npm install --global corepack
          corepack enable
        fi
        if [ -f yarn.lock ]; then
          scopes="$(jq -cn --arg token "$NODE_TOKEN" '{abinnovision: {npmPublishRegistry: "https://npm.pkg.github.com", npmRegistryServer: "https://npm.pkg.github.com", npmAlwaysAuth: false, npmAuthToken: $token}}')"
          yarn config set -H --json npmScopes "$scopes"
          echo "yarn-cache=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"
        fi

    - name: "Cache yarn"
      if: steps.node.outputs.yarn-cache != ''
      uses: actions/cache@v6
      with:
        path: ${{ steps.node.outputs.yarn-cache }}
        key: setup-tools-yarn-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('yarn.lock') }}

    - name: "Setup Turbo cache"
      if: steps.mise.outputs.node != '' && hashFiles('turbo.json') != ''
      uses: rharkor/caching-for-turbo@v2.3.13

    # Go and uv
    - id: paths
      name: "Resolve cache paths"
      if: steps.mise.outputs.go != '' || steps.mise.outputs.uv != '' || steps.uv.outputs.version != ''
      shell: bash
      env:
        GO_VERSION: ${{ steps.mise.outputs.go }}
        UV_VERSION: ${{ steps.mise.outputs.uv || steps.uv.outputs.version }}
      run: |
        if [ -n "$GO_VERSION" ]; then
          # Keep the pinned Go version, as actions/setup-go does.
          [ -n "${GOTOOLCHAIN:-}" ] || echo "GOTOOLCHAIN=local" >> "$GITHUB_ENV"
          {
            echo "go-mod-cache=$(go env GOMODCACHE)"
            echo "go-build-cache=$(go env GOCACHE)"
          } >> "$GITHUB_OUTPUT"
        fi
        if [ -n "$UV_VERSION" ]; then
          echo "uv-cache=$(uv cache dir)" >> "$GITHUB_OUTPUT"
        fi

    - name: "Cache Go modules and build"
      if: steps.paths.outputs.go-mod-cache != ''
      uses: actions/cache@v6
      with:
        path: |
          ${{ steps.paths.outputs.go-mod-cache }}
          ${{ steps.paths.outputs.go-build-cache }}
        key: setup-tools-go-${{ runner.os }}-${{ runner.arch }}-${{ steps.mise.outputs.go }}-${{ hashFiles('**/go.sum') }}

    - name: "Cache uv"
      if: steps.paths.outputs.uv-cache != ''
      uses: actions/cache@v6
      with:
        path: ${{ steps.paths.outputs.uv-cache }}
        key: setup-tools-uv-${{ runner.os }}-${{ runner.arch }}-${{ steps.mise.outputs.python }}-${{ hashFiles('**/uv.lock') }}
